name: Build SeedSigner OS (Luckfox Pico)

# The Luckfox matrix is expensive (5 combos, ~1-2h each), so auto-runs are scoped
# to Luckfox-relevant paths. Use "Run workflow" (workflow_dispatch) for on-demand builds.
on:
  push:
    branches: [ main, dev ]
    paths:
      - 'opt/luckfox/**'
      - 'opt/external-packages/**'
      - '.github/workflows/build-luckfox.yml'
  pull_request:
    paths:
      - 'opt/luckfox/**'
      - 'opt/external-packages/**'
      - '.github/workflows/build-luckfox.yml'
  workflow_dispatch:
    inputs:
      hardware_type:
        description: 'Hardware Type (ALL builds every valid hardware/boot combination)'
        required: true
        type: choice
        options:
          - ALL
          - RV1103_Luckfox_Pico_Mini
          - RV1106_Luckfox_Pico_Pro_Max
          - RV1106_Luckfox_Pico_Pi
        default: 'RV1103_Luckfox_Pico_Mini'
      boot_medium:
        description: 'Boot Medium (ALL builds every valid boot medium for the selected hardware)'
        required: true
        type: choice
        options:
          - ALL
          - SD_CARD
          - SPI_NAND
          - EMMC
        default: 'SD_CARD'
      disable_uart2_console_debug:
        description: 'Serial console (ttyFIQ0) override: auto follows build_variant (non-dev=off, dev=on); or force true/false'
        required: false
        type: choice
        options:
          - 'auto'
          - 'true'
          - 'false'
        default: 'auto'
      build_variant:
        description: 'Build variant: non-dev (hardened/air-gapped: no serial login, no USB adb/RNDIS, no logging, no dev tools) or dev (serial console + adb shell). Automatic push/PR CI always builds dev.'
        required: false
        type: choice
        options:
          - 'non-dev'
          - 'dev'
        default: 'non-dev'
      luckfox_repo_url:
        description: 'LuckFox Pico SDK Repository URL'
        required: false
        type: string
        default: 'https://github.com/3rdIteration/luckfox-pico.git'
      luckfox_branch:
        description: 'LuckFox Pico SDK Branch (leave empty for default branch)'
        required: false
        type: string
        default: ''
      seedsigner_repo_url:
        description: 'SeedSigner Repository URL'
        required: false
        type: string
        default: 'https://github.com/3rdIteration/seedsigner.git'
      seedsigner_branch:
        description: 'SeedSigner Branch'
        required: false
        type: string
        default: 'dev'
      build_rust_from_source:
        description: 'Build Rust toolchain from source (ignore cached binary). Use when updating Rust version.'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Upload artifacts to a GitHub Release with this tag (leave empty to skip release upload)'
        required: false
        type: string
        default: ''

  # Allow other repos (e.g. the seedsigner app) to reuse this build. Inputs mirror
  # workflow_dispatch (as strings, since workflow_call has no `choice` type) plus
  # seedsigner_os_repo/ref for the reusable checkout.
  workflow_call:
    inputs:
      hardware_type:
        required: false
        type: string
        default: 'RV1103_Luckfox_Pico_Mini'
      boot_medium:
        required: false
        type: string
        default: 'SD_CARD'
      disable_uart2_console_debug:
        required: false
        type: string
        default: 'auto'
      build_variant:
        required: false
        type: string
        default: 'non-dev'
      luckfox_repo_url:
        required: false
        type: string
        default: 'https://github.com/3rdIteration/luckfox-pico.git'
      luckfox_branch:
        required: false
        type: string
        default: ''
      seedsigner_repo_url:
        required: false
        type: string
        default: 'https://github.com/3rdIteration/seedsigner.git'
      seedsigner_branch:
        required: false
        type: string
        default: 'dev'
      build_rust_from_source:
        required: false
        type: boolean
        default: false
      release_tag:
        required: false
        type: string
        default: ''
      seedsigner_os_repo:
        description: 'seedsigner-os repository to build from (owner/name)'
        required: false
        type: string
        default: ''
      seedsigner_os_ref:
        description: 'seedsigner-os ref (branch/tag/sha) to build from'
        required: false
        type: string
        default: ''

jobs:
  build:
    name: Build (${{ matrix.hardware }} / ${{ matrix.boot }})
    runs-on: ubuntu-22.04
    timeout-minutes: 240  # 4 hours max
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # When manually triggered via workflow_dispatch with specific (non-ALL) inputs, build that single combination.
          # Otherwise (push, pull_request, or ALL selected), build all 5 valid combinations.
          ${{ (inputs.hardware_type != '' && inputs.hardware_type != 'ALL' && inputs.boot_medium != '' && inputs.boot_medium != 'ALL') && fromJSON(format('[{{"hardware":"{0}","boot":"{1}"}}]', inputs.hardware_type, inputs.boot_medium)) || fromJSON('[
            {"hardware":"RV1103_Luckfox_Pico_Mini","boot":"SD_CARD"},
            {"hardware":"RV1103_Luckfox_Pico_Mini","boot":"SPI_NAND"},
            {"hardware":"RV1106_Luckfox_Pico_Pro_Max","boot":"SD_CARD"},
            {"hardware":"RV1106_Luckfox_Pico_Pro_Max","boot":"SPI_NAND"},
            {"hardware":"RV1106_Luckfox_Pico_Pi","boot":"EMMC"}
          ]') }}
    
    steps:
    - name: Checkout seedsigner-os repository
      uses: actions/checkout@v4
      with:
        # Defaults target this repo/ref for direct push/dispatch runs; a caller
        # (e.g. the seedsigner app's build-luckfox workflow) overrides these to
        # build a specific seedsigner-os checkout.
        repository: ${{ inputs.seedsigner_os_repo || github.repository }}
        ref: ${{ inputs.seedsigner_os_ref || github.ref }}
        path: seedsigner-os

    - name: Validate build combination
      run: |
        HARDWARE="${{ matrix.hardware }}"
        BOOT="${{ matrix.boot }}"

        echo "Validating build combination: $HARDWARE / $BOOT"

        case "$HARDWARE:$BOOT" in
          "RV1103_Luckfox_Pico_Mini:SD_CARD" | \
          "RV1103_Luckfox_Pico_Mini:SPI_NAND" | \
          "RV1106_Luckfox_Pico_Pro_Max:SD_CARD" | \
          "RV1106_Luckfox_Pico_Pro_Max:SPI_NAND" | \
          "RV1106_Luckfox_Pico_Pi:EMMC")
            echo "✅ Valid combination"
            ;;
          *)
            echo "❌ Invalid combination: $HARDWARE / $BOOT"
            echo "Valid combinations are:"
            echo "  - RV1103_Luckfox_Pico_Mini: SD_CARD or SPI_NAND"
            echo "  - RV1106_Luckfox_Pico_Pro_Max: SD_CARD or SPI_NAND"
            echo "  - RV1106_Luckfox_Pico_Pi: EMMC"
            exit 1
            ;;
        esac

    - name: Free up disk space
      run: |
        sudo apt-get clean
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        df -h

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git ssh make gcc gcc-multilib g++-multilib \
          module-assistant expect g++ gawk texinfo \
          libssl-dev bison flex fakeroot cmake unzip \
          gperf autoconf device-tree-compiler \
          libncurses5-dev pkg-config bc python-is-python3 \
          passwd openssl openssh-server openssh-client \
          vim file cpio rsync

    - name: Clone required repositories
      run: |
        # Set repository URLs and branches with fallbacks
        # Use workflow_dispatch inputs if available, otherwise use defaults
        LUCKFOX_REPO="${{ inputs.luckfox_repo_url || 'https://github.com/3rdIteration/luckfox-pico.git' }}"
        LUCKFOX_BRANCH="${{ inputs.luckfox_branch || '' }}"
        SEEDSIGNER_REPO="${{ inputs.seedsigner_repo_url || 'https://github.com/3rdIteration/seedsigner.git' }}"
        SEEDSIGNER_BRANCH="${{ inputs.seedsigner_branch || 'dev' }}"
        # SeedSigner OS Buildroot packages come from this checked-out repo
        # (../seedsigner-os/opt/external-packages); nothing to clone.

        echo "Repository Configuration:"
        echo "  LuckFox SDK:     $LUCKFOX_REPO${LUCKFOX_BRANCH:+ @ $LUCKFOX_BRANCH}"
        echo "  SeedSigner OS:   (in-repo: ../seedsigner-os)"
        echo "  SeedSigner Code: $SEEDSIGNER_REPO @ $SEEDSIGNER_BRANCH"
        echo ""
        
        # Clone LuckFox Pico SDK (forked version with SeedSigner modifications)
        # This fork includes hardware customizations like CMA memory settings, pull-up resistors, etc.
        echo "Cloning luckfox-pico SDK..."
        if [ -n "$LUCKFOX_BRANCH" ]; then
          # Clone specific branch if provided
          if ! git clone "$LUCKFOX_REPO" --depth=1 -b "$LUCKFOX_BRANCH" --single-branch luckfox-pico; then
            echo "ERROR: Failed to clone luckfox-pico SDK from $LUCKFOX_REPO (branch: $LUCKFOX_BRANCH)"
            exit 1
          fi
        else
          # Clone default branch if no branch specified
          if ! git clone "$LUCKFOX_REPO" --depth=1 --single-branch luckfox-pico; then
            echo "ERROR: Failed to clone luckfox-pico SDK from $LUCKFOX_REPO"
            exit 1
          fi
        fi
        
        # Clone SeedSigner code (dev branch contains LuckFox-specific adaptations)
        echo "Cloning seedsigner application code..."
        if ! git clone "$SEEDSIGNER_REPO" --depth=1 -b "$SEEDSIGNER_BRANCH" --single-branch --recurse-submodules seedsigner; then
          echo "ERROR: Failed to clone seedsigner code from $SEEDSIGNER_REPO (branch: $SEEDSIGNER_BRANCH)"
          echo "This branch may have been renamed or removed"
          exit 1
        fi
        
        echo "All repositories cloned successfully"

    - name: Compile SeedSigner translations
      run: |
        # Compile .po -> .mo (and slim CJK fonts) in the seedsigner checkout so
        # the image ships working multi-language support. Must run before the
        # checkout is copied into the rootfs and before l10n/ is pruned (the
        # fork's setup.py compile_catalog merges the l10n/fork overlay). Degrades
        # gracefully to English-only if the toolchain is unavailable.
        bash seedsigner-os/opt/luckfox/compile-translations.sh seedsigner

    - name: Apply SeedSigner SDK patches
      run: |
        cd luckfox-pico
        
        echo "🔧 Applying SeedSigner optimizations to LuckFox SDK..."
        echo ""
        
        # Show files before patching
        echo "📋 Checking target files..."
        if [ -f project/cfg/BoardConfig_IPC/BoardConfig-SPI_NAND-Buildroot-RV1103_Luckfox_Pico_Mini-IPC.mk ]; then
          echo "  ✓ Mini BoardConfig found"
        else
          echo "  ✗ Mini BoardConfig NOT FOUND!"
          exit 1
        fi
        
        if [ -f project/cfg/BoardConfig_IPC/BoardConfig-SPI_NAND-Buildroot-RV1106_Luckfox_Pico_Pro_Max-IPC.mk ]; then
          echo "  ✓ Max BoardConfig found"
        else
          echo "  ✗ Max BoardConfig NOT FOUND!"
          exit 1
        fi
        echo ""
        
        # Apply Mini SPI-NAND partition optimization using sed (more reliable than patches)
        echo "📦 Applying Mini SPI-NAND partition optimization..."
        MINI_FILE="project/cfg/BoardConfig_IPC/BoardConfig-SPI_NAND-Buildroot-RV1103_Luckfox_Pico_Mini-IPC.mk"
        # Remove userdata from partition table and shrink OEM, expand rootfs (Mini has 128MB flash)
        sed -i 's/30M(oem),6M(userdata),85M(rootfs)/20M(oem),99M(rootfs)/' "$MINI_FILE"
        # Remove userdata from filesystem config  
        sed -i 's/,userdata@\/userdata@ubifs//' "$MINI_FILE"
        echo "  ✓ Mini SPI-NAND partition modified (sed)"
        echo ""
        
        # Apply Max SPI-NAND partition optimization using sed
        echo "📦 Applying Max SPI-NAND partition optimization..."
        MAX_FILE="project/cfg/BoardConfig_IPC/BoardConfig-SPI_NAND-Buildroot-RV1106_Luckfox_Pico_Pro_Max-IPC.mk"
        # Remove userdata from partition table and shrink OEM, expand rootfs (Max has 256MB flash)
        sed -i 's/30M(oem),10M(userdata),210M(rootfs)/20M(oem),227M(rootfs)/' "$MAX_FILE"
        # Remove userdata from filesystem config
        sed -i 's/,userdata@\/userdata@ubifs//' "$MAX_FILE"
        echo "  ✓ Max SPI-NAND partition modified (sed)"
        echo ""

        # Apply Pi eMMC partition update to remove userdata.img expectation
        echo "📦 Applying Pi eMMC partition update..."
        PI_FILE="project/cfg/BoardConfig_IPC/BoardConfig-EMMC-Buildroot-RV1106_Luckfox_Pico_Pi-IPC.mk"
        if [ -f "$PI_FILE" ]; then
          sed -i 's/,256M(userdata),/,/' "$PI_FILE"
          sed -i 's/,userdata@\/userdata@ext4//' "$PI_FILE"
          echo "  ✓ Pi eMMC userdata removed from partition/fs config (sed)"
        else
          echo "  ⚠ Pi eMMC BoardConfig not found, skipping"
        fi
        echo ""

        # Verify patches were applied by checking partition sizes
        echo "🔍 Verifying patches..."
        MINI_PARTITION=$(grep "RK_PARTITION_CMD_IN_ENV=" project/cfg/BoardConfig_IPC/BoardConfig-SPI_NAND-Buildroot-RV1103_Luckfox_Pico_Mini-IPC.mk | head -1)
        MAX_PARTITION=$(grep "RK_PARTITION_CMD_IN_ENV=" project/cfg/BoardConfig_IPC/BoardConfig-SPI_NAND-Buildroot-RV1106_Luckfox_Pico_Pro_Max-IPC.mk | head -1)
        
        echo "Mini partition table:"
        echo "  $MINI_PARTITION"
        echo ""
        echo "Max partition table:"
        echo "  $MAX_PARTITION"
        echo ""
        
        # Check if patches actually modified the files
        if echo "$MINI_PARTITION" | grep -q "99M(rootfs)"; then
          echo "✅ Mini partition optimization VERIFIED (rootfs = 99MB for 128MB flash)"
        else
          echo "⚠️  WARNING: Mini partition may not be optimized!"
        fi
        
        if echo "$MAX_PARTITION" | grep -q "227M(rootfs)"; then
          echo "✅ Max partition optimization VERIFIED (rootfs = 103MB for 256MB flash)"
        else
          echo "⚠️  WARNING: Max partition may not be optimized!"
        fi
        echo ""
        
        echo "✅ Partition layout optimized:"
        echo "  Mini (128MB flash):"
        echo "    - OEM: 30MB → 20MB (save 10MB)"
        echo "    - Userdata: 6MB → Removed (save 6MB)"
        echo "    - Rootfs: 85MB → 99MB (gain 14MB, fits 128MB with margin)"
        echo "  Max (256MB flash):"
        echo "    - OEM: 30MB → 20MB (save 10MB)"
        echo "    - Userdata: 10MB → Removed (save 10MB)"
        echo "    - Rootfs: 210MB → 103MB (optimized for consistency)"
        echo ""
        
        # Show partition summary for Mini
        echo "📊 Mini SPI-NAND Partition Summary (128MB flash):"
        echo "  ┌─────────────┬──────────┬────────────┬─────────────┐"
        echo "  │ Partition   │ Size     │ Offset     │ Purpose     │"
        echo "  ├─────────────┼──────────┼────────────┼─────────────┤"
        echo "  │ env         │   256 KB │ 0x00000    │ Environment │"
        echo "  │ idblock     │   256 KB │ 0x40000    │ Boot ID     │"
        echo "  │ uboot       │   512 KB │ 0x80000    │ U-Boot      │"
        echo "  │ boot        │     4 MB │ 0x100000   │ Kernel+DTB  │"
        echo "  │ oem         │    20 MB │ 0x500000   │ OEM data    │"
        echo "  │ rootfs      │    99 MB │ 0x1900000  │ Root FS     │"
        echo "  └─────────────┴──────────┴────────────┴─────────────┘"
        echo "  Total allocated: ~124 MB (fits 128MB with 4MB margin)"
        echo ""
        
        # Show partition summary for Max
        echo "📊 Max SPI-NAND Partition Summary (256MB flash):"
        echo "  ┌─────────────┬──────────┬────────────┬─────────────┐"
        echo "  │ Partition   │ Size     │ Offset     │ Purpose     │"
        echo "  ├─────────────┼──────────┼────────────┼─────────────┤"
        echo "  │ env         │   256 KB │ 0x00000    │ Environment │"
        echo "  │ idblock     │   256 KB │ 0x40000    │ Boot ID     │"
        echo "  │ uboot       │   512 KB │ 0x80000    │ U-Boot      │"
        echo "  │ boot        │     4 MB │ 0x100000   │ Kernel+DTB  │"
        echo "  │ oem         │    20 MB │ 0x500000   │ OEM data    │"
        echo "  │ rootfs      │   103 MB │ 0x1900000  │ Root FS     │"
        echo "  └─────────────┴──────────┴────────────┴─────────────┘"
        echo "  Total allocated: ~128 MB (fits 128MB SPI-NAND)"
        echo ""

    - name: Set up build environment
      run: |
        cd luckfox-pico
        
        # Source the toolchain environment and export to GITHUB_ENV
        cd tools/linux/toolchain/arm-rockchip830-linux-uclibcgnueabihf
        
        # Source the environment script
        source env_install_toolchain.sh
        
        # Export PATH to GITHUB_ENV so it persists to next steps
        echo "PATH=$PATH" >> $GITHUB_ENV
        
        # Also export the CROSS_COMPILE variable if it exists
        if [ -n "$CROSS_COMPILE" ]; then
          echo "CROSS_COMPILE=$CROSS_COMPILE" >> $GITHUB_ENV
        fi
        
        cd ../../../..
        
        # Verify toolchain is accessible
        which arm-rockchip830-linux-uclibcgnueabihf-gcc || echo "WARNING: Toolchain not in PATH yet, but will be in next step"

    - name: Configure board
      run: |
        cd luckfox-pico
        
        HARDWARE="${{ matrix.hardware }}"
        BOOT_MEDIUM="${{ matrix.boot }}"
        
        # Map hardware type to SDK lunch menu index
        # Based on os-build.sh select_board_profile() function
        if [[ "$HARDWARE" == "RV1103_Luckfox_Pico_Mini" ]]; then
          HW_INDEX=1
        elif [[ "$HARDWARE" == "RV1106_Luckfox_Pico_Pro_Max" ]]; then
          HW_INDEX=4
        elif [[ "$HARDWARE" == "RV1106_Luckfox_Pico_Pi" ]]; then
          HW_INDEX=7
        else
          echo "Error: Unknown hardware type: $HARDWARE"
          exit 1
        fi
        
        # Map boot medium to SDK lunch menu index
        # For eMMC boards the SDK presents only [0] EMMC, so boot_index is always 0
        if [[ "$BOOT_MEDIUM" == "SD_CARD" ]]; then
          BOOT_INDEX=0
        elif [[ "$BOOT_MEDIUM" == "SPI_NAND" ]]; then
          BOOT_INDEX=1
        elif [[ "$BOOT_MEDIUM" == "EMMC" ]]; then
          BOOT_INDEX=0
        else
          echo "Error: Unknown boot medium: $BOOT_MEDIUM"
          exit 1
        fi
        
        # System version index: 0 = Buildroot (the only supported option for this build)
        SYSTEM_INDEX=0
        
        echo "Configuring board: Hardware index=$HW_INDEX, Boot index=$BOOT_INDEX, System index=$SYSTEM_INDEX"
        echo "This corresponds to: $HARDWARE with $BOOT_MEDIUM using Buildroot"
        
        # Run the SDK's board configuration (lunch menu)
        # Automatically select: hardware type, boot medium, system version (buildroot)
        printf "%s\n%s\n%s\n" "$HW_INDEX" "$BOOT_INDEX" "$SYSTEM_INDEX" | ./build.sh lunch
        
        # Verify the board config was created
        if [ ! -f ".BoardConfig.mk" ]; then
          echo "Error: Board config file .BoardConfig.mk was not created"
          exit 1
        fi
        
        echo "Board configuration completed successfully"
        echo "Current board config:"
        ls -la .BoardConfig.mk
        
        # Export the board config path for later steps
        BOARD_CONFIG_PATH="project/cfg/BoardConfig_IPC/BoardConfig-${BOOT_MEDIUM}-Buildroot-${HARDWARE}-IPC.mk"
        echo "BOARD_CONFIG_PATH=$BOARD_CONFIG_PATH" >> $GITHUB_ENV
        echo "Board config source file: $BOARD_CONFIG_PATH"

    - name: Configure UART2 console debug
      run: |
        cd luckfox-pico

        DISABLE_UART2_CONSOLE_DEBUG="${{ inputs.disable_uart2_console_debug }}"
        # Effective variant: push/PR CI has no inputs -> 'dev' (validate the full,
        # debuggable stack); explicit dispatch/call keeps its build_variant default.
        BUILD_VARIANT="${{ inputs.build_variant || 'dev' }}"
        # Console: explicit true/false wins; otherwise (auto/empty) non-dev strips
        # the serial console and dev keeps it.
        case "$DISABLE_UART2_CONSOLE_DEBUG" in
          true|false) ;;
          *) if [ "$BUILD_VARIANT" = "non-dev" ]; then DISABLE_UART2_CONSOLE_DEBUG="true"; else DISABLE_UART2_CONSOLE_DEBUG="false"; fi ;;
        esac

        BOARD_CONFIG="$BOARD_CONFIG_PATH"
        if [ ! -f "$BOARD_CONFIG" ] && [ -L ".BoardConfig.mk" ]; then
          BOARD_CONFIG="$(readlink -f .BoardConfig.mk)"
        fi
        echo "UART2 console debug setting: disable=${DISABLE_UART2_CONSOLE_DEBUG}"
        echo "Target board config: $BOARD_CONFIG"

        if [ "$DISABLE_UART2_CONSOLE_DEBUG" = "true" ]; then
          if [ ! -f "$BOARD_CONFIG" ]; then
            echo "ERROR: Board config file not found for UART2 console settings: $BOARD_CONFIG"
            exit 1
          fi

          echo "UART bootargs debug (before patch):"
          grep -nE 'ttyFIQ0|console=|earlycon=|user_debug=|CMDLINE|BOOTARGS' "$BOARD_CONFIG" || echo "  (no matching bootarg tokens)"
          sed -i 's/\<console=ttyFIQ0[^ "]*\>//g; s/\<earlycon=uart8250,[^ "]*\>//g; s/\<user_debug=[^ "]*\>//g' "$BOARD_CONFIG"
          echo "UART bootargs debug (after patch):"
          grep -nE 'ttyFIQ0|console=|earlycon=|user_debug=|CMDLINE|BOOTARGS' "$BOARD_CONFIG" || echo "  (no matching bootarg tokens)"

          if grep -Eq '(^|[[:space:]])console=ttyFIQ0([^[:space:]]*)?([[:space:]]|$)' "$BOARD_CONFIG"; then
            echo "ERROR: Failed to remove UART2 console argument from $BOARD_CONFIG"
            exit 1
          fi
          echo "UART2 console debug disabled in $BOARD_CONFIG"
        else
          echo "UART2 console debug remains enabled"
        fi

    - name: Configure UART2 console debug in DTS
      run: |
        cd luckfox-pico

        DISABLE_UART2_CONSOLE_DEBUG="${{ inputs.disable_uart2_console_debug }}"
        # Effective variant: push/PR CI has no inputs -> 'dev' (validate the full,
        # debuggable stack); explicit dispatch/call keeps its build_variant default.
        BUILD_VARIANT="${{ inputs.build_variant || 'dev' }}"
        # Console: explicit true/false wins; otherwise (auto/empty) non-dev strips
        # the serial console and dev keeps it.
        case "$DISABLE_UART2_CONSOLE_DEBUG" in
          true|false) ;;
          *) if [ "$BUILD_VARIANT" = "non-dev" ]; then DISABLE_UART2_CONSOLE_DEBUG="true"; else DISABLE_UART2_CONSOLE_DEBUG="false"; fi ;;
        esac

        HARDWARE="${{ matrix.hardware }}"
        if [[ "$HARDWARE" == "RV1103_Luckfox_Pico_Mini" ]]; then
          DTS_FILE="sysdrv/source/kernel/arch/arm/boot/dts/rv1103g-luckfox-pico-mini.dts"
          DTSI_FILE="sysdrv/source/kernel/arch/arm/boot/dts/rv1103-luckfox-pico-ipc.dtsi"
        elif [[ "$HARDWARE" == "RV1106_Luckfox_Pico_Pro_Max" ]]; then
          DTS_FILE="sysdrv/source/kernel/arch/arm/boot/dts/rv1106g-luckfox-pico-pro-max.dts"
          DTSI_FILE="sysdrv/source/kernel/arch/arm/boot/dts/rv1106-luckfox-pico-pro-max-ipc.dtsi"
        elif [[ "$HARDWARE" == "RV1106_Luckfox_Pico_Pi" ]]; then
          DTS_FILE="sysdrv/source/kernel/arch/arm/boot/dts/rv1106g-luckfox-pico-pi.dts"
          DTSI_FILE="sysdrv/source/kernel/arch/arm/boot/dts/rv1106-luckfox-pico-pi-ipc.dtsi"
        else
          echo "ERROR: Unknown hardware for DTS patch: $HARDWARE"
          exit 1
        fi

        echo "UART2 console debug DTS setting: disable=${DISABLE_UART2_CONSOLE_DEBUG}"
        echo "Target DTS files: $DTS_FILE , $DTSI_FILE"

        if [ "$DISABLE_UART2_CONSOLE_DEBUG" = "true" ]; then
          for target in "$DTS_FILE" "$DTSI_FILE"; do
            if [ ! -f "$target" ]; then
              echo "ERROR: DTS source file not found for UART2 console settings: $target"
              exit 1
            fi

            echo "UART bootargs debug in DTS source (before patch): $target"
            grep -nE 'ttyFIQ0|console=|earlycon=|user_debug=|bootargs' "$target" || echo "  (no matching bootarg tokens)"
            sed -i 's/\<console=ttyFIQ0[^ "]*\>//g; s/\<earlycon=uart8250,[^ "]*\>//g; s/\<user_debug=[^ "]*\>//g' "$target"
            # Non-dev: quieter boot + reboot-on-panic (so a kernel panic doesn't hang
            # forever — it reboots and the boot-failover machinery gets another shot).
            # Only appends inside an existing chosen bootargs="..." string (no-op otherwise).
            if [ "$BUILD_VARIANT" = "non-dev" ]; then
              sed -i -E '/bootargs[[:space:]]*=/ { /quiet/! s/(bootargs[[:space:]]*=[[:space:]]*"[^"]*)"/\1 quiet loglevel=3 panic=5"/ }' "$target"
            fi
            if grep -Eq '&uart2[[:space:]]*\{' "$target"; then
              sed -i '/&uart2[[:space:]]*{/,/};/ s/status[[:space:]]*=[[:space:]]*"[^"]*"/status = "okay"/' "$target"
            else
              printf '\n&uart2 {\n\tstatus = "okay";\n};\n' >> "$target"
            fi
            echo "UART bootargs debug in DTS source (after patch): $target"
            grep -nE 'ttyFIQ0|console=|earlycon=|user_debug=|bootargs' "$target" || echo "  (no matching bootarg tokens)"

            if grep -Eq '(^|[[:space:]])console=ttyFIQ0([^[:space:]]*)?([[:space:]]|$)' "$target"; then
              echo "ERROR: Failed to remove UART2 console argument from $target"
              exit 1
            fi
          done
          echo "UART2 console debug disabled in DTS sources: $DTS_FILE , $DTSI_FILE"
        else
          echo "UART2 console debug remains enabled in DTS"
        fi

    - name: Configure UART2 FIQ debugger in kernel defconfig
      run: |
        cd luckfox-pico

        DISABLE_UART2_CONSOLE_DEBUG="${{ inputs.disable_uart2_console_debug }}"
        # Effective variant: push/PR CI has no inputs -> 'dev' (validate the full,
        # debuggable stack); explicit dispatch/call keeps its build_variant default.
        BUILD_VARIANT="${{ inputs.build_variant || 'dev' }}"
        # Console: explicit true/false wins; otherwise (auto/empty) non-dev strips
        # the serial console and dev keeps it.
        case "$DISABLE_UART2_CONSOLE_DEBUG" in
          true|false) ;;
          *) if [ "$BUILD_VARIANT" = "non-dev" ]; then DISABLE_UART2_CONSOLE_DEBUG="true"; else DISABLE_UART2_CONSOLE_DEBUG="false"; fi ;;
        esac

        if [ "$DISABLE_UART2_CONSOLE_DEBUG" = "true" ]; then
          BOARD_CONFIG="$BOARD_CONFIG_PATH"
          if [ ! -f "$BOARD_CONFIG" ] && [ -L ".BoardConfig.mk" ]; then
            BOARD_CONFIG="$(readlink -f .BoardConfig.mk)"
          fi
          if [ ! -f "$BOARD_CONFIG" ]; then
            echo "ERROR: Board config file not found for kernel FIQ patch: $BOARD_CONFIG"
            exit 1
          fi

          KERNEL_DEFCONFIG=$(sed -n 's/^export RK_KERNEL_DEFCONFIG="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' "$BOARD_CONFIG" | head -n1)
          if [ -z "$KERNEL_DEFCONFIG" ]; then
            KERNEL_DEFCONFIG="luckfox_rv1106_linux_defconfig"
          fi
          KERNEL_CFG_FILE="sysdrv/source/kernel/arch/arm/configs/${KERNEL_DEFCONFIG}"
          if [ ! -f "$KERNEL_CFG_FILE" ]; then
            echo "ERROR: Kernel defconfig file not found for FIQ patch: $KERNEL_CFG_FILE"
            exit 1
          fi

          echo "Disabling FIQ debugger in kernel defconfig: $KERNEL_CFG_FILE"
          sed -i -E '/^CONFIG_FIQ_DEBUGGER(=|_)/d;/^# CONFIG_FIQ_DEBUGGER is not set$/d' "$KERNEL_CFG_FILE"
          echo '# CONFIG_FIQ_DEBUGGER is not set' >> "$KERNEL_CFG_FILE"
          sed -i -E '/^CONFIG_SERIAL_8250(=|_)/d;/^# CONFIG_SERIAL_8250 is not set$/d' "$KERNEL_CFG_FILE"
          sed -i -E '/^CONFIG_SERIAL_8250_DW(=|_)/d;/^# CONFIG_SERIAL_8250_DW is not set$/d' "$KERNEL_CFG_FILE"
          sed -i -E '/^CONFIG_SERIAL_OF_PLATFORM(=|_)/d;/^# CONFIG_SERIAL_OF_PLATFORM is not set$/d' "$KERNEL_CFG_FILE"
          printf 'CONFIG_SERIAL_8250=y\nCONFIG_SERIAL_8250_DW=y\nCONFIG_SERIAL_OF_PLATFORM=y\n' >> "$KERNEL_CFG_FILE"

          if grep -Eq '^CONFIG_FIQ_DEBUGGER(=|_)' "$KERNEL_CFG_FILE"; then
            echo "ERROR: Failed to disable FIQ debugger in $KERNEL_CFG_FILE"
            exit 1
          fi
          grep -nE 'FIQ_DEBUGGER|SERIAL_8250|SERIAL_OF_PLATFORM' "$KERNEL_CFG_FILE" || true
        else
          echo "UART2 FIQ debugger configuration remains enabled"
        fi

    - name: Enable HWRNG and hardware crypto in kernel defconfig and DTS
      run: |
        cd luckfox-pico

        HARDWARE="${{ matrix.hardware }}"
        BOARD_CONFIG="$BOARD_CONFIG_PATH"
        if [ ! -f "$BOARD_CONFIG" ] && [ -L ".BoardConfig.mk" ]; then
          BOARD_CONFIG="$(readlink -f .BoardConfig.mk)"
        fi
        if [ ! -f "$BOARD_CONFIG" ]; then
          echo "ERROR: Board config file not found for HWRNG/crypto patch: $BOARD_CONFIG"
          exit 1
        fi

        KERNEL_DEFCONFIG=$(sed -n 's/^export RK_KERNEL_DEFCONFIG="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' "$BOARD_CONFIG" | head -n1)
        if [ -z "$KERNEL_DEFCONFIG" ]; then
          KERNEL_DEFCONFIG="luckfox_rv1106_linux_defconfig"
        fi
        KERNEL_CFG_FILE="sysdrv/source/kernel/arch/arm/configs/${KERNEL_DEFCONFIG}"
        if [ ! -f "$KERNEL_CFG_FILE" ]; then
          echo "ERROR: Kernel defconfig file not found for HWRNG/crypto patch: $KERNEL_CFG_FILE"
          exit 1
        fi

        echo "Enabling HWRNG and hardware crypto in kernel defconfig: $KERNEL_CFG_FILE"

        # Enable hardware random number generator
        sed -i -E '/^CONFIG_HW_RANDOM(=|_)/d;/^# CONFIG_HW_RANDOM is not set$/d' "$KERNEL_CFG_FILE"
        sed -i -E '/^CONFIG_HW_RANDOM_ROCKCHIP(=|_)/d;/^# CONFIG_HW_RANDOM_ROCKCHIP is not set$/d' "$KERNEL_CFG_FILE"
        printf 'CONFIG_HW_RANDOM=y\nCONFIG_HW_RANDOM_ROCKCHIP=y\n' >> "$KERNEL_CFG_FILE"

        # Enable Rockchip hardware crypto (crypto v3 for RV1106/RV1103)
        sed -i -E '/^CONFIG_CRYPTO_DEV_ROCKCHIP(=|_)/d;/^# CONFIG_CRYPTO_DEV_ROCKCHIP is not set$/d' "$KERNEL_CFG_FILE"
        sed -i -E '/^CONFIG_CRYPTO_DEV_ROCKCHIP_DEV(=|_)/d;/^# CONFIG_CRYPTO_DEV_ROCKCHIP_DEV is not set$/d' "$KERNEL_CFG_FILE"
        printf 'CONFIG_CRYPTO_DEV_ROCKCHIP=y\nCONFIG_CRYPTO_DEV_ROCKCHIP_DEV=y\n' >> "$KERNEL_CFG_FILE"

        if ! grep -Eq '^CONFIG_HW_RANDOM=y$' "$KERNEL_CFG_FILE"; then
          echo "ERROR: Failed to enable CONFIG_HW_RANDOM in $KERNEL_CFG_FILE"
          exit 1
        fi
        if ! grep -Eq '^CONFIG_HW_RANDOM_ROCKCHIP=y$' "$KERNEL_CFG_FILE"; then
          echo "ERROR: Failed to enable CONFIG_HW_RANDOM_ROCKCHIP in $KERNEL_CFG_FILE"
          exit 1
        fi
        if ! grep -Eq '^CONFIG_CRYPTO_DEV_ROCKCHIP=y$' "$KERNEL_CFG_FILE"; then
          echo "ERROR: Failed to enable CONFIG_CRYPTO_DEV_ROCKCHIP in $KERNEL_CFG_FILE"
          exit 1
        fi
        if ! grep -Eq '^CONFIG_CRYPTO_DEV_ROCKCHIP_DEV=y$' "$KERNEL_CFG_FILE"; then
          echo "ERROR: Failed to enable CONFIG_CRYPTO_DEV_ROCKCHIP_DEV in $KERNEL_CFG_FILE"
          exit 1
        fi
        echo "HWRNG and hardware crypto kernel config enabled in: $KERNEL_CFG_FILE"
        grep -nE 'HW_RANDOM|CRYPTO_DEV_ROCKCHIP' "$KERNEL_CFG_FILE" || true

        # Enable crypto DTS node in the board-level DTS file
        if [[ "$HARDWARE" == "RV1103_Luckfox_Pico_Mini" ]]; then
          DTS_FILE="sysdrv/source/kernel/arch/arm/boot/dts/rv1103g-luckfox-pico-mini.dts"
        elif [[ "$HARDWARE" == "RV1106_Luckfox_Pico_Pro_Max" ]]; then
          DTS_FILE="sysdrv/source/kernel/arch/arm/boot/dts/rv1106g-luckfox-pico-pro-max.dts"
        elif [[ "$HARDWARE" == "RV1106_Luckfox_Pico_Pi" ]]; then
          DTS_FILE="sysdrv/source/kernel/arch/arm/boot/dts/rv1106g-luckfox-pico-pi.dts"
        else
          echo "ERROR: Unknown hardware for crypto DTS patch: $HARDWARE"
          exit 1
        fi
        if [ ! -f "$DTS_FILE" ]; then
          echo "ERROR: DTS file not found for crypto node patch: $DTS_FILE"
          exit 1
        fi
        if grep -Eq '&crypto[[:space:]]*\{' "$DTS_FILE"; then
          sed -i '/&crypto[[:space:]]*{/,/};/ s/status[[:space:]]*=[[:space:]]*"[^"]*"/status = "okay"/' "$DTS_FILE"
        else
          printf '\n&crypto {\n\tstatus = "okay";\n};\n' >> "$DTS_FILE"
        fi
        if ! awk '/&crypto[[:space:]]*\{/{found=1} found && /status[[:space:]]*=[[:space:]]*"okay"/{ok=1} /\};/{if(found)exit} END{exit !ok}' "$DTS_FILE"; then
          echo "ERROR: Crypto DTS node enable verification failed in: $DTS_FILE"
          exit 1
        fi
        echo "Crypto DTS node enabled in: $DTS_FILE"

    - name: Apply CMA memory configuration for Mini
      if: matrix.hardware == 'RV1103_Luckfox_Pico_Mini'
      run: |
        cd luckfox-pico
        
        CMA_SIZE="1M"
        
        echo "Applying CMA configuration for Mini hardware: ${CMA_SIZE}"
        
        # Use the board config path exported from Configure board step
        BOARD_CONFIG="$BOARD_CONFIG_PATH"
        
        if [ -f "$BOARD_CONFIG" ]; then
          # Check if RK_BOOTARGS_CMA_SIZE exists and update it, or add it
          if grep -q '^export RK_BOOTARGS_CMA_SIZE=' "$BOARD_CONFIG"; then
            sed -i "s|^export RK_BOOTARGS_CMA_SIZE=.*|export RK_BOOTARGS_CMA_SIZE=\"${CMA_SIZE}\"|" "$BOARD_CONFIG"
            echo "Updated existing CMA size in: $BOARD_CONFIG"
          else
            echo "export RK_BOOTARGS_CMA_SIZE=\"${CMA_SIZE}\"" >> "$BOARD_CONFIG"
            echo "Added CMA size to: $BOARD_CONFIG"
          fi
          
          # Verify the change
          echo "Current CMA configuration:"
          grep 'RK_BOOTARGS_CMA_SIZE' "$BOARD_CONFIG" || echo "No CMA configuration found (will use default)"
        else
          echo "Warning: Board config file not found: $BOARD_CONFIG"
        fi

    - name: Prepare buildroot source tree
      run: |
        cd luckfox-pico
        make buildroot_create -C sysdrv

    - name: Install SeedSigner packages
      run: |
        cd luckfox-pico
        
        # Auto-detect buildroot directory
        BUILDROOT_DIR=$(find sysdrv/source/buildroot -maxdepth 1 -type d -name 'buildroot-*' | sort | tail -n 1)
        
        if [ -z "$BUILDROOT_DIR" ] || [ ! -d "$BUILDROOT_DIR" ]; then
          echo "ERROR: Could not locate buildroot directory under sysdrv/source/buildroot"
          exit 1
        fi
        
        echo "Using buildroot directory: $BUILDROOT_DIR"
        PACKAGE_DIR="${BUILDROOT_DIR}/package"
        
        # Copy the converged, toolchain-aware SeedSigner packages (single set)
        # from this repo. The uClibc/glibc backend differences are handled inside
        # the package definitions, so there is no separate override overlay.
        cp -rv ../seedsigner-os/opt/external-packages/* "$PACKAGE_DIR/"
        
        # Update pyzbar patch
        # Note: Will be updated with actual Python version after .config is created in next step
        PYZBAR_PATCH="${PACKAGE_DIR}/python-pyzbar/0001-PATH-fixed-by-hand.patch"
        if [ -f "$PYZBAR_PATCH" ]; then
          echo "pyzbar patch found, will be updated after buildroot config is applied"
        fi
        
        # Add SeedSigner menu to buildroot Config.in
        CONFIG_IN="${PACKAGE_DIR}/Config.in"
        if ! grep -q '^menu "SeedSigner"$' "$CONFIG_IN"; then
          cat >> "$CONFIG_IN" << 'EOF'
        menu "SeedSigner"
        	source "package/python-urtypes/Config.in"
        	source "package/python-pyzbar/Config.in"
        	source "package/python-mock/Config.in"
        	source "package/python-embit/Config.in"
        	source "package/python-mnemonic/Config.in"
        	source "package/python-shamir-mnemonic/Config.in"
        	source "package/python-pillow/Config.in"
        	source "package/zbar/Config.in"
        	source "package/jpeg-turbo/Config.in.options"
        	source "package/jpeg/Config.in"
        	source "package/python-qrcode/Config.in"
        	source "package/python-pyqrcode/Config.in"
        	source "package/python-pyscard/Config.in"
        	source "package/python-pysatochip/Config.in"
        	source "package/python-pgpy/Config.in"
        	source "package/ccid-sec1210/Config.in"
        	source "package/python-ndeflib/Config.in"
        	source "package/python-keycard-py/Config.in"
        	source "package/python-specter-card/Config.in"
        	source "package/python-pygp/Config.in"
        	source "package/python-smbus2/Config.in"
        	source "package/libraqm/Config.in"
        endmenu
        EOF
        fi

        # Patch Rust Kconfig to support uclibc Tier 3 targets (armv7-unknown-linux-uclibceabihf).
        # Buildroot 2024.11.4 only gates Rust target support for glibc/musl. Without this,
        # BR2_PACKAGE_HOST_RUSTC_TARGET_ARCH_SUPPORTS is never set for uclibc toolchains,
        # silently disabling python-cryptography and any other Rust-dependent package.
        RUSTC_CONFIG="${PACKAGE_DIR}/rustc/Config.in.host"
        if [ -f "$RUSTC_CONFIG" ] && ! grep -q 'BR2_PACKAGE_HOST_RUSTC_TARGET_TIER3_UCLIBC_PLATFORMS' "$RUSTC_CONFIG"; then
          echo "🦀 Patching Rust Config.in.host for uclibc Tier 3 support..."
          # Add Tier 3 uclibc config block before BR2_PACKAGE_HOST_RUSTC_TARGET_ARCH_SUPPORTS
          sed -i '/^# All target rust packages should depend on this option/i\
        # Tier 3 uclibc platforms - must be built from source (no pre-built std binaries)\
        # When adding new entries below, update RUST_TARGETS in utils/update-rust\
        config BR2_PACKAGE_HOST_RUSTC_TARGET_TIER3_UCLIBC_PLATFORMS\
        \tbool\
        \t# armv7-unknown-linux-uclibceabihf\
        \tdefault y if BR2_ARM_CPU_ARMV7A \&\& BR2_ARM_EABIHF \&\& BR2_TOOLCHAIN_USES_UCLIBC\
        \t# armv7-unknown-linux-uclibceabihf for armv8 hardware with 32-bit userspace\
        \tdefault y if BR2_arm \&\& BR2_ARM_CPU_ARMV8A \&\& BR2_ARM_EABIHF \&\& BR2_TOOLCHAIN_USES_UCLIBC\
        ' "$RUSTC_CONFIG"
          # Include Tier 3 uclibc in TARGET_ARCH_SUPPORTS
          sed -i '/default y if BR2_PACKAGE_HOST_RUSTC_TARGET_TIER2_PLATFORMS/a\
        \tdefault y if BR2_PACKAGE_HOST_RUSTC_TARGET_TIER3_UCLIBC_PLATFORMS' "$RUSTC_CONFIG"
          echo "  ✅ Config.in.host patched"
        fi

        # Patch rust-bin.mk to skip downloading/installing pre-built rust-std for uclibc
        # (pre-built binaries don't exist for Tier 3 targets; host-rust builds them from source)
        RUSTBIN_MK="${PACKAGE_DIR}/rust-bin/rust-bin.mk"
        if [ -f "$RUSTBIN_MK" ] && ! grep -q 'BR2_TOOLCHAIN_USES_UCLIBC' "$RUSTBIN_MK"; then
          echo "🦀 Patching rust-bin.mk to skip uclibc std download..."
          # Wrap EXTRA_DOWNLOADS with uclibc guard
          sed -i '/^ifeq ($(BR2_PACKAGE_HOST_RUSTC_TARGET_ARCH_SUPPORTS),y)/{
        N
        /HOST_RUST_BIN_EXTRA_DOWNLOADS/{
        s/ifeq ($(BR2_PACKAGE_HOST_RUSTC_TARGET_ARCH_SUPPORTS),y)\n/# Pre-built rust-std is not available for uclibc Tier 3 targets;\n# host-rust (build from source) will compile it instead.\nifeq ($(BR2_PACKAGE_HOST_RUSTC_TARGET_ARCH_SUPPORTS),y)\nifneq ($(BR2_TOOLCHAIN_USES_UCLIBC),y)\n/
        }
        }' "$RUSTBIN_MK"
          sed -i '/^HOST_RUST_BIN_EXTRA_DOWNLOADS += rust-std/{
        N
        /^HOST_RUST_BIN_EXTRA_DOWNLOADS.*\nendif/{
        s/\nendif/\nendif\nendif/
        }
        }' "$RUSTBIN_MK"
          # Wrap INSTALL_LIBSTD_TARGET with uclibc guard
          sed -i '/^ifeq ($(BR2_PACKAGE_HOST_RUSTC_TARGET_ARCH_SUPPORTS),y)/{
        N
        /define HOST_RUST_BIN_INSTALL_LIBSTD_TARGET/{
        s/ifeq ($(BR2_PACKAGE_HOST_RUSTC_TARGET_ARCH_SUPPORTS),y)\n/# Skip installing pre-built target std for uclibc (not available);\n# host-rust (build from source) provides it.\nifeq ($(BR2_PACKAGE_HOST_RUSTC_TARGET_ARCH_SUPPORTS),y)\nifneq ($(BR2_TOOLCHAIN_USES_UCLIBC),y)\n/
        }
        }' "$RUSTBIN_MK"
          sed -i '/^endef/{
        N
        /^endef\nendif/{
        s/^endef\nendif/endef\nendif\nendif/
        }
        }' "$RUSTBIN_MK"
          echo "  ✅ rust-bin.mk patched"
        fi

    - name: Apply SeedSigner buildroot configuration
      run: |
        cd luckfox-pico
        
        # Auto-detect buildroot directory
        BUILDROOT_DIR=$(find sysdrv/source/buildroot -maxdepth 1 -type d -name 'buildroot-*' | sort | tail -n 1)
        
        if [ -z "$BUILDROOT_DIR" ] || [ ! -d "$BUILDROOT_DIR" ]; then
          echo "ERROR: Could not locate buildroot directory under sysdrv/source/buildroot"
          exit 1
        fi
        
        echo "Using buildroot directory: $BUILDROOT_DIR"
        
        # Copy SeedSigner defconfig
        cp -v ../seedsigner-os/opt/luckfox/configs/luckfox_pico_defconfig "$BUILDROOT_DIR/configs/luckfox_pico_defconfig"
        # Also copy as luckfox_pico_w_defconfig so the Pi board (RK_BUILDROOT_DEFCONFIG=luckfox_pico_w_defconfig)
        # loads our clean config instead of the SDK's WiFi/BT-enabled config
        cp -v ../seedsigner-os/opt/luckfox/configs/luckfox_pico_defconfig "$BUILDROOT_DIR/configs/luckfox_pico_w_defconfig"
        cp -v ../seedsigner-os/opt/luckfox/configs/luckfox_pico_defconfig "$BUILDROOT_DIR/.config"

        # Non-dev (production) hardening: no serial login (getty) and no dev/network
        # CLI tools on the target. Applied to every copied defconfig. (A package that
        # `select`s one of these keeps it enabled at make-time -> no build break.)
        if [ "${{ inputs.build_variant || 'dev' }}" = "non-dev" ]; then
          echo "🔒 non-dev: hardening defconfig (getty off; drop pip/curl/wget; optimize for size)"
          for dc in "$BUILDROOT_DIR/configs/luckfox_pico_defconfig" "$BUILDROOT_DIR/configs/luckfox_pico_w_defconfig" "$BUILDROOT_DIR/.config"; do
            [ -f "$dc" ] || continue
            sed -i -E \
              -e 's/^BR2_TARGET_GENERIC_GETTY=y/# BR2_TARGET_GENERIC_GETTY is not set/' \
              -e 's/^BR2_PACKAGE_PYTHON_PIP=y/# BR2_PACKAGE_PYTHON_PIP is not set/' \
              -e 's/^BR2_PACKAGE_WGET=y/# BR2_PACKAGE_WGET is not set/' \
              -e 's/^BR2_PACKAGE_LIBCURL=y/# BR2_PACKAGE_LIBCURL is not set/' \
              -e 's/^BR2_PACKAGE_LIBCURL_CURL=y/# BR2_PACKAGE_LIBCURL_CURL is not set/' \
              -e 's/^BR2_OPTIMIZE_3=y/BR2_OPTIMIZE_S=y/' \
              "$dc"
          done
        fi

        # Remove pip/setuptools/git from Mini SPI-NAND builds to save space
        if [[ "${HARDWARE}" == "RV1103_Luckfox_Pico_Mini" ]] && [[ "${BOOT_MEDIUM}" == "SPI_NAND" ]]; then
          echo "🔧 Removing python-pip, python-setuptools, and git for Mini SPI-NAND build..."
          sed -i "s/^BR2_PACKAGE_PYTHON_PIP=y/# BR2_PACKAGE_PYTHON_PIP is not set/" "$BUILDROOT_DIR/.config"
          sed -i "s/^BR2_PACKAGE_PYTHON_SETUPTOOLS=y/# BR2_PACKAGE_PYTHON_SETUPTOOLS is not set/" "$BUILDROOT_DIR/.config"
          sed -i "s/^BR2_PACKAGE_GIT=y/# BR2_PACKAGE_GIT is not set/" "$BUILDROOT_DIR/.config"
          echo "✅ Removed pip/setuptools/git packages for Mini SPI-NAND"
        fi
        
        # Now that .config exists, update pyzbar patch with actual Python version if available
        PACKAGE_DIR="${BUILDROOT_DIR}/package"
        PYZBAR_PATCH="${PACKAGE_DIR}/python-pyzbar/0001-PATH-fixed-by-hand.patch"
        if [ -f "$PYZBAR_PATCH" ] && [ -f "$BUILDROOT_DIR/.config" ]; then
          PYTHON_VER="3.12"
          DETECTED_PYTHON_VER=$(grep -oP 'BR2_PACKAGE_PYTHON3_VERSION="\K[^"]+' "$BUILDROOT_DIR/.config" 2>/dev/null || true)
          if [ -n "$DETECTED_PYTHON_VER" ]; then
            PYTHON_VER="$DETECTED_PYTHON_VER"
            echo "Updated pyzbar patch for Python ${PYTHON_VER} (detected from config)"
          else
            echo "No Python version found in config; using default Python ${PYTHON_VER}"
          fi
          sed -i "s|path = \".*/site-packages/zbar.so\"|path = \"/usr/lib/python${PYTHON_VER}/site-packages/zbar.so\"|" "$PYZBAR_PATCH"
        fi

        # Normalize python-pyzbar download source for Buildroot mirror compatibility.
        # Keep the same upstream content/hash, but force a deterministic tag tarball URL.
        PYZBAR_MK="${PACKAGE_DIR}/python-pyzbar/python-pyzbar-ss.mk"
        PYZBAR_HASH="${PACKAGE_DIR}/python-pyzbar/python-pyzbar-ss.hash"
        if [ -f "$PYZBAR_MK" ]; then
          PYZBAR_VER=$(sed -n 's/^PYTHON_PYZBAR_VERSION[[:space:]]*=[[:space:]]*//p' "$PYZBAR_MK" | head -n 1 | tr -d '[:space:]')
          PYZBAR_SRC="v${PYZBAR_VER}.tar.gz"
          sed -i "s|^PYTHON_PYZBAR_SITE[[:space:]]*=.*|PYTHON_PYZBAR_SITE = https://github.com/SeedSigner/pyzbar/archive/refs/tags|" "$PYZBAR_MK"
          if grep -q '^PYTHON_PYZBAR_SOURCE[[:space:]]*=' "$PYZBAR_MK"; then
            sed -i "s|^PYTHON_PYZBAR_SOURCE[[:space:]]*=.*|PYTHON_PYZBAR_SOURCE = ${PYZBAR_SRC}|" "$PYZBAR_MK"
          else
            sed -i "/^PYTHON_PYZBAR_SITE[[:space:]]*=/a PYTHON_PYZBAR_SOURCE = ${PYZBAR_SRC}" "$PYZBAR_MK"
          fi
          sed -i '/^PYTHON_PYZBAR_SITE_METHOD[[:space:]]*=/d' "$PYZBAR_MK"
          echo "Normalized python-pyzbar source to ${PYZBAR_SRC}"

          if [ -f "$PYZBAR_HASH" ]; then
            sed -i -E "/^(sha256|md5)[[:space:]]/ s/[[:space:]][^[:space:]]+$/ ${PYZBAR_SRC}/" "$PYZBAR_HASH"
            echo "Updated python-pyzbar hash filename to ${PYZBAR_SRC}"
          fi
        fi

    - name: Restore cached Rust toolchain
      if: ${{ inputs.build_rust_from_source != true }}
      id: rust-cache
      uses: actions/cache@v4
      with:
        path: /tmp/rust-toolchain.tar.zst
        key: rust-toolchain-v2-${{ hashFiles('seedsigner-os/opt/luckfox/configs/luckfox_pico_defconfig') }}

    - name: Extract cached Rust toolchain
      if: steps.rust-cache.outputs.cache-hit == 'true'
      run: |
        cd luckfox-pico

        CACHE_TAR="/tmp/rust-toolchain.tar.zst"
        if [ ! -f "$CACHE_TAR" ]; then
          echo "⚠️  Cache file missing despite cache hit — will build from source"
          echo "RUST_FROM_CACHE=false" >> $GITHUB_ENV
          exit 0
        fi

        BUILDROOT_DIR=$(find sysdrv/source/buildroot -maxdepth 1 -type d -name 'buildroot-*' | sort | tail -n 1)
        if [ -z "$BUILDROOT_DIR" ] || [ ! -d "$BUILDROOT_DIR" ]; then
          echo "ERROR: Could not locate buildroot directory"
          echo "RUST_FROM_CACHE=false" >> $GITHUB_ENV
          exit 0
        fi

        echo "🦀 Restoring cached Rust toolchain into $BUILDROOT_DIR ..."
        mkdir -p "$BUILDROOT_DIR/output"
        tar --zstd -xf "$CACHE_TAR" -C "$BUILDROOT_DIR/output"

        # Detect Rust version from the extracted binary
        RUST_VERSION=""
        if [ -x "$BUILDROOT_DIR/output/host/bin/rustc" ]; then
          RUST_VERSION=$("$BUILDROOT_DIR/output/host/bin/rustc" --version 2>/dev/null | grep -oP '\d+\.\d+\.\d+' || true)
        fi

        # Create stamp files so buildroot skips the Rust packages entirely.
        STAMPS=".stamp_downloaded .stamp_extracted .stamp_patched .stamp_configured .stamp_built .stamp_host_installed"
        RUST_PKG_DIRS="$BUILDROOT_DIR/output/build/host-rustc"
        if [ -n "$RUST_VERSION" ]; then
          RUST_PKG_DIRS="$RUST_PKG_DIRS $BUILDROOT_DIR/output/build/host-rust-bin-$RUST_VERSION"
          RUST_PKG_DIRS="$RUST_PKG_DIRS $BUILDROOT_DIR/output/build/host-rust-$RUST_VERSION"
        fi

        for pkg_dir in $RUST_PKG_DIRS; do
          if [ -d "$pkg_dir" ] && [ -f "$pkg_dir/.stamp_host_installed" ]; then
            echo "  Stamps already present in $(basename "$pkg_dir")"
            continue
          fi
          mkdir -p "$pkg_dir"
          for s in $STAMPS; do touch "$pkg_dir/$s"; done
          echo "  Created stamps for $(basename "$pkg_dir")"
        done

        if [ -x "$BUILDROOT_DIR/output/host/bin/rustc" ] && \
           [ -x "$BUILDROOT_DIR/output/host/bin/cargo" ] && \
           "$BUILDROOT_DIR/output/host/bin/rustc" --version > /dev/null 2>&1; then
          echo "✅ Cached Rust toolchain restored successfully"
          "$BUILDROOT_DIR/output/host/bin/rustc" --version
          echo "RUST_FROM_CACHE=true" >> $GITHUB_ENV
        else
          echo "⚠️  Cached toolchain missing binaries or libraries — will build from source"
          # Remove stamps from ALL Rust-related build directories so buildroot
          # rebuilds Rust from source. We must use glob patterns because RUST_VERSION
          # may be empty when rustc --version fails (e.g. missing shared libraries).
          for pkg_dir in "$BUILDROOT_DIR"/output/build/host-rust-bin-* \
                         "$BUILDROOT_DIR"/output/build/host-rust-[0-9]* \
                         "$BUILDROOT_DIR"/output/build/host-rustc; do
            if [ -d "$pkg_dir" ]; then
              rm -f "$pkg_dir"/.stamp_*
              echo "  Removed stamps from $(basename "$pkg_dir")"
            fi
          done
          # Remove broken binaries to avoid confusing buildroot
          rm -rf "$BUILDROOT_DIR/output/host/bin/rustc" \
                 "$BUILDROOT_DIR/output/host/bin/cargo" \
                 "$BUILDROOT_DIR/output/host/lib/rustlib" 2>/dev/null || true
          echo "RUST_FROM_CACHE=false" >> $GITHUB_ENV
        fi

    - name: Non-dev U-Boot recovery config (bootdelay + bootcount→loader failover)
      if: ${{ (inputs.build_variant || 'dev') == 'non-dev' }}
      run: |
        cd luckfox-pico
        echo "🔧 non-dev: U-Boot recovery config (bootdelay=0 + bootcount→loader)"
        # bootdelay (already 0 on the Luckfox SDK; guard kept for other SDK versions).
        for f in $(grep -rlE '^CONFIG_BOOTDELAY=[1-9]' sysdrv 2>/dev/null | grep -iE 'uboot|u-boot' || true); do
          sed -i -E 's/^CONFIG_BOOTDELAY=[1-9][0-9]*/CONFIG_BOOTDELAY=0/' "$f"; echo "  zeroed CONFIG_BOOTDELAY in $f"
        done
        # Enable the U-Boot boot counter so N consecutive boots that never reach
        # userspace auto-enter rockusb Loader (via altbootcmd, set from the OS at
        # runtime). NOTE: this Rockchip U-Boot 2017.09 fork's drivers/bootcount/Kconfig
        # only defines CONFIG_BOOTCOUNT / CONFIG_BOOTCOUNT_EXT — there is NO
        # CONFIG_BOOTCOUNT_LIMIT / _ENV Kconfig symbol, so appending those to a defconfig
        # is silently dropped (verified on-device: bootcount never compiled in). Instead
        # use the always-built generic backend (drivers/bootcount/bootcount.c is obj-y)
        # via board-header #defines: the counter lives in a FREE GRF OS_REG scratch
        # register (0xFF020218) that survives a warm reset (kernel-panic reboot loops)
        # and auto-clears on a cold power-cycle. autoboot.c's bootdelay_process() runs
        # the increment + "bootcount > bootlimit -> altbootcmd" check on every boot.
        # (Hardware-verified on a live Pico Pro Max: reg is free, survives reboot -f, and
        # U-Boot honours the mtd0 env that fw_setenv writes.) The OS clears the counter
        # via `devmem 0xFF020218 32 0` once userspace is up (start-seedsigner.sh), so only
        # boots that never get that far accumulate toward the limit.
        bc=0
        for h in $(find sysdrv -path '*uboot*/include/configs/rv1106_common.h' 2>/dev/null || true); do
          if ! grep -q 'CONFIG_SYS_BOOTCOUNT_ADDR' "$h"; then
            awk '
              { print }
              !done && /^#define CONFIG_PREBOOT[ \t]*$/ {
                print "";
                print "/* SeedSigner boot-failover: memory-backed boot counter in a free GRF";
                print " * OS_REG scratch register (survives warm reset, clears on cold power-off). */";
                print "#define CONFIG_BOOTCOUNT_LIMIT";
                print "#define CONFIG_SYS_BOOTCOUNT_SINGLEWORD";
                print "#define CONFIG_SYS_BOOTCOUNT_ADDR\t0xFF020218";
                done=1
              }
            ' "$h" > "$h.ssbc" && mv "$h.ssbc" "$h"
          fi
          grep -q 'CONFIG_SYS_BOOTCOUNT_ADDR' "$h" \
            && { echo "  enabled memory-backed bootcount (GRF 0xFF020218) in $(basename "$h")"; bc=1; }
        done
        [ "$bc" -eq 1 ] || echo "  ⚠️  rv1106_common.h not patched — bootcount NOT enabled (userspace watchdog still covers app failures)"

    - name: Build system
      run: |
        cd luckfox-pico
        
        # Unset GITHUB_ACTIONS so Rust's x.py bootstrap doesn't enforce --stage 2.
        # Rust 1.82+'s CiEnv::current() checks GITHUB_ACTIONS (not CI) to detect
        # CI environments, and panics if stage != 2. Buildroot's host-rust calls
        # x.py build without --stage 2.
        unset GITHUB_ACTIONS
        
        ./build.sh uboot
        ./build.sh kernel
        ./build.sh rootfs
        ./build.sh media
        
        # Keep vendor RkLunch.sh camera bring-up behavior on all builds.
        echo "Keeping RkLunch.sh rkipc autostart enabled"
        ./build.sh app

    - name: Package Rust toolchain for caching
      if: steps.rust-cache.outputs.cache-hit != 'true' || env.RUST_FROM_CACHE != 'true'
      run: |
        cd luckfox-pico
        BUILDROOT_DIR=$(find sysdrv/source/buildroot -maxdepth 1 -type d -name 'buildroot-*' | sort | tail -n 1)

        if [ -z "$BUILDROOT_DIR" ] || [ ! -d "$BUILDROOT_DIR" ]; then
          echo "WARNING: Could not locate buildroot directory, skipping toolchain packaging"
          exit 0
        fi

        cd "$BUILDROOT_DIR/output"

        if [ ! -x host/bin/rustc ]; then
          echo "WARNING: No rustc found in output/host/bin, skipping toolchain packaging"
          exit 0
        fi

        echo "📦 Packaging Rust toolchain for future builds..."
        host/bin/rustc --version

        # Collect stamp files for the Rust packages
        STAMP_DIRS=""
        for d in build/host-rust-bin-* build/host-rust-[0-9]* build/host-rustc; do
          if [ -d "$d" ]; then
            STAMP_DIRS="$STAMP_DIRS $(find "$d" -maxdepth 1 -name '.stamp_*' -type f)"
          fi
        done

        # Collect Rust-specific files from host/
        RUST_FILES=$(mktemp)
        {
          for f in host/bin/rustc host/bin/cargo host/bin/rustdoc host/bin/rust-gdb \
                   host/bin/rust-gdbgui host/bin/rust-lldb; do
            [ -e "$f" ] && echo "$f"
          done
          [ -d "host/lib/rustlib" ] && find host/lib/rustlib \( -type f -o -type l \)
          # Include Rust shared libraries required by rustc at runtime
          find host/lib -maxdepth 1 \( -name 'librustc_driver-*.so' -o -name 'libstd-*.so' -o -name 'libtest-*.so' -o -name 'libLLVM-*.so' \) \( -type f -o -type l \) 2>/dev/null || true
          echo "$STAMP_DIRS" | tr ' ' '\n' | grep -v '^$'
        } | sort -u > "$RUST_FILES"

        echo "  Files to package: $(wc -l < "$RUST_FILES")"
        tar --zstd -cf /tmp/rust-toolchain.tar.zst --files-from="$RUST_FILES"
        rm -f "$RUST_FILES"
        ls -lh /tmp/rust-toolchain.tar.zst
        echo "✅ Rust toolchain packaged (will be saved to actions/cache automatically)"

    - name: Install SeedSigner application
      run: |
        cd luckfox-pico
        
        # Find rootfs directory
        ROOTFS_DIRS=($(find output/out -maxdepth 1 -type d -name "rootfs_uclibc_*"))
        
        if [ ${#ROOTFS_DIRS[@]} -eq 0 ]; then
          echo "ERROR: Could not find rootfs directory"
          exit 1
        elif [ ${#ROOTFS_DIRS[@]} -gt 1 ]; then
          echo "WARNING: Multiple rootfs directories found:"
          printf '  %s\n' "${ROOTFS_DIRS[@]}"
          echo "Using first match: ${ROOTFS_DIRS[0]}"
        fi
        
        ROOTFS_DIR="${ROOTFS_DIRS[0]}"
        echo "Using rootfs directory: $ROOTFS_DIR"
        
        # Install the SeedSigner app to /opt, matching the Raspberry Pi
        # SeedSigner-OS layout (opt/build.sh download_app_repo): the whole repo
        # is placed at /opt so /opt/src runs the app and its sibling resource
        # dirs resolve correctly (/opt/javacard-cap bundled applets,
        # /opt/gpg_keys release-signing keys — both located relative to the
        # source tree by the app), then prune everything not needed at runtime.
        mkdir -p "$ROOTFS_DIR/opt"
        cp -a ../seedsigner/. "$ROOTFS_DIR/opt/"

        # Prune dev/build cruft (mirror opt/build.sh) to keep the rootfs small.
        rm -rf "$ROOTFS_DIR/opt/.git" "$ROOTFS_DIR/opt/.github" \
               "$ROOTFS_DIR/opt/.translation-venv"
        rm -rf "$ROOTFS_DIR/opt/docker" "$ROOTFS_DIR/opt/docs" \
               "$ROOTFS_DIR/opt/enclosures" "$ROOTFS_DIR/opt/electronics" \
               "$ROOTFS_DIR/opt/l10n" "$ROOTFS_DIR/opt/seedsigner-screenshots" \
               "$ROOTFS_DIR/opt/tests" "$ROOTFS_DIR/opt/hardware-kicad" \
               "$ROOTFS_DIR/opt/img" "$ROOTFS_DIR/opt/test_suite"
        rm -f  "$ROOTFS_DIR/opt/.gitignore" "$ROOTFS_DIR/opt/.gitmodules" \
               "$ROOTFS_DIR/opt/.gitattributes" "$ROOTFS_DIR/opt/.python-version" \
               "$ROOTFS_DIR/opt/README.md" "$ROOTFS_DIR/opt/LICENSE.md" \
               "$ROOTFS_DIR/opt/docker-compose.yml" "$ROOTFS_DIR/opt/MANIFEST.in" \
               "$ROOTFS_DIR/opt/pyproject.toml" "$ROOTFS_DIR/opt/seedsigner_pubkey.gpg"
        rm -f  "$ROOTFS_DIR/opt/"setup.* "$ROOTFS_DIR/opt/"requirements*.txt
        # Strip the translations submodule .git and the now-compiled .po sources.
        rm -rf "$ROOTFS_DIR/opt/src/seedsigner/resources/seedsigner-translations/.git"* 2>/dev/null || true
        find "$ROOTFS_DIR/opt/src/seedsigner/resources/seedsigner-translations/l10n" \
             -name '*.po' -delete 2>/dev/null || true

        # Patch settings.json for Mini hardware to use FOX_22 instead of FOX_40
        HARDWARE="${{ matrix.hardware }}"
        SETTINGS_JSON="$ROOTFS_DIR/opt/src/settings.json"
        
        if [[ "$HARDWARE" == *"Mini"* ]]; then
          echo "Patching settings.json for Mini hardware (FOX_22)..."
          if [ -f "$SETTINGS_JSON" ]; then
            # Replace FOX_40 with FOX_22 in hardware_config setting
            sed -i 's/"hardware_config":[[:space:]]*"FOX_40"/"hardware_config": "FOX_22"/g' "$SETTINGS_JSON"
            echo "Settings.json patched for Mini hardware"
            # Verify the change
            grep -A 1 '"hardware_config"' "$SETTINGS_JSON" || echo "Warning: Could not verify hardware_config setting"
          else
            echo "Warning: settings.json not found at $SETTINGS_JSON"
          fi
        else
          echo "RV1106 hardware (Max or Pi) detected - keeping default FOX_40 configuration"
        fi
        
        # Fix pyzbar library path - symlink zbar.so from site-packages to /usr/lib
        # This fix is applied to ALL build types (Mini and Max, SD and NAND)
        PYTHON_VERSION=$(ls "$ROOTFS_DIR/usr/lib/" | grep -E '^python3\.[0-9]+$' | head -n 1)
        if [ -n "$PYTHON_VERSION" ]; then
          echo "Setting up zbar.so for pyzbar (Python $PYTHON_VERSION)..."
          SITE_PACKAGES="$ROOTFS_DIR/usr/lib/$PYTHON_VERSION/site-packages"
          
          if [ -f "$SITE_PACKAGES/zbar.so" ]; then
            echo "✓ zbar.so found in site-packages"
            
            # Create symlink in /usr/lib for pyzbar to find
            USR_LIB="$ROOTFS_DIR/usr/lib"
            if [ ! -e "$USR_LIB/zbar.so" ]; then
              echo "Creating symlink: /usr/lib/zbar.so -> $PYTHON_VERSION/site-packages/zbar.so"
              ln -sf "$PYTHON_VERSION/site-packages/zbar.so" "$USR_LIB/zbar.so"
              echo "✓ Symlink created successfully"
            else
              echo "✓ zbar.so already exists in /usr/lib"
            fi
          else
            echo "WARNING: zbar.so not found in $SITE_PACKAGES"
            echo "Searching for zbar.so in rootfs..."
            find "$ROOTFS_DIR" -name "zbar.so" 2>/dev/null || echo "zbar.so not found anywhere in rootfs"
          fi
        else
          echo "Warning: Could not detect Python version in rootfs"
        fi
        
        # Copy configuration files
        if [[ "$HARDWARE" == *"Mini"* ]]; then
          LUCKFOX_CFG_TEMPLATE="../seedsigner-os/opt/luckfox/files/luckfox-mini.cfg"
        elif [[ "$HARDWARE" == *"Max"* ]]; then
          LUCKFOX_CFG_TEMPLATE="../seedsigner-os/opt/luckfox/files/luckfox-max.cfg"
        elif [[ "$HARDWARE" == *"Pico_Pi"* ]]; then
          LUCKFOX_CFG_TEMPLATE="../seedsigner-os/opt/luckfox/files/luckfox-pi.cfg"
        else
          LUCKFOX_CFG_TEMPLATE="../seedsigner-os/opt/luckfox/files/luckfox.cfg"
          echo "WARNING: Unknown hardware '$HARDWARE', using fallback luckfox.cfg"
        fi

        cp -v "$LUCKFOX_CFG_TEMPLATE" "$ROOTFS_DIR/etc/luckfox.cfg"
        cp -v ../seedsigner-os/opt/luckfox/files/nv12_converter "$ROOTFS_DIR/"
        cp -v ../seedsigner-os/opt/luckfox/files/start-seedsigner.sh "$ROOTFS_DIR/"
        cp -v ../seedsigner-os/opt/luckfox/files/configure-gpio.sh "$ROOTFS_DIR/usr/bin/configure-gpio.sh"
        chmod +x "$ROOTFS_DIR/usr/bin/configure-gpio.sh"
        cp -v ../seedsigner-os/opt/luckfox/files/rk-reboot "$ROOTFS_DIR/usr/bin/rk-reboot"
        chmod +x "$ROOTFS_DIR/usr/bin/rk-reboot"
        cp -v ../seedsigner-os/opt/luckfox/files/S02fsck "$ROOTFS_DIR/etc/init.d/"
        cp -v ../seedsigner-os/opt/luckfox/files/S10mdev "$ROOTFS_DIR/etc/init.d/"
        cp -v ../seedsigner-os/opt/luckfox/files/S60pcscd "$ROOTFS_DIR/etc/init.d/"
        cp -v ../seedsigner-os/opt/luckfox/files/S99seedsigner "$ROOTFS_DIR/etc/init.d/"
        chmod +x "$ROOTFS_DIR/etc/init.d/S02fsck"
        chmod +x "$ROOTFS_DIR/etc/init.d/S10mdev"
        chmod +x "$ROOTFS_DIR/etc/init.d/S60pcscd"
        chmod +x "$ROOTFS_DIR/etc/init.d/S99seedsigner"
        if [[ -f "../seedsigner-os/opt/luckfox/files/mdev.conf" ]]; then
          cp -v ../seedsigner-os/opt/luckfox/files/mdev.conf "$ROOTFS_DIR/etc/mdev.conf"
        fi
        if [[ -f "../seedsigner-os/opt/luckfox/files/fat-fsck-hotplug" ]]; then
          cp -v ../seedsigner-os/opt/luckfox/files/fat-fsck-hotplug "$ROOTFS_DIR/usr/sbin/fat-fsck-hotplug"
          chmod +x "$ROOTFS_DIR/usr/sbin/fat-fsck-hotplug"
        fi
        mkdir -p "$ROOTFS_DIR/etc/reader.conf.d"
        cp -v ../seedsigner-os/opt/luckfox/files/sec1210 "$ROOTFS_DIR/etc/reader.conf.d/sec1210"
        mkdir -p "$ROOTFS_DIR/etc/readers.d"
        cp -v ../seedsigner-os/opt/luckfox/files/sec1210 "$ROOTFS_DIR/etc/readers.d/sec1210"
        if [[ -d "$ROOTFS_DIR/usr/lib/pcsc/drivers/ifd-ccid.bundle" ]]; then
          echo "Removing USB CCID bundle as temporary workaround for pcscd SIGTERM issue"
          rm -rf "$ROOTFS_DIR/usr/lib/pcsc/drivers/ifd-ccid.bundle"
        fi
        
        # Install rkaiq camera ISP service script (manual start only, no boot autostart)
        echo "🔧 Installing rkaiq service script..."
        if [[ -f "../seedsigner-os/opt/luckfox/files/rkaiq-service" ]]; then
          cp -v ../seedsigner-os/opt/luckfox/files/rkaiq-service "$ROOTFS_DIR/usr/bin/rkaiq-service"
          chmod +x "$ROOTFS_DIR/usr/bin/rkaiq-service"
          echo "✅ rkaiq-service installed to /usr/bin/"
        else
          echo "⚠️  Warning: rkaiq-service file not found"
          echo "   rkaiq-service will not be available"
        fi

        # Generate the SeedSigner OS identity + provenance marker: positively
        # identifies a SeedSigner OS build to the app and records both repos'
        # branch/commit/date for the System Info screen.
        echo "🔧 Generating /etc/seedsigner-os-release ..."
        SEEDSIGNER_OS_REPO="${{ format('https://github.com/{0}', github.repository) }}" \
        SEEDSIGNER_OS_GIT_DIR="$GITHUB_WORKSPACE/seedsigner-os" \
        SEEDSIGNER_APP_REPO="${{ inputs.seedsigner_repo_url || 'https://github.com/3rdIteration/seedsigner.git' }}" \
        SEEDSIGNER_APP_BRANCH="${{ inputs.seedsigner_branch || 'dev' }}" \
        SEEDSIGNER_APP_GIT_DIR="$GITHUB_WORKSPACE/seedsigner" \
          bash ../seedsigner-os/opt/gen-os-release.sh "$ROOTFS_DIR/etc/seedsigner-os-release" \
          || echo "⚠️  Warning: could not generate seedsigner-os-release"

        # Non-dev (production) hardening of the built rootfs: remove the serial
        # login shell, USB adb/RNDIS gadget, and logging daemons. Guarded/no-op on
        # dev builds. Review the [harden] log lines to confirm vectors were closed.
        if [ "${{ inputs.build_variant || 'dev' }}" = "non-dev" ]; then
          echo "🔒 Applying non-dev rootfs hardening ..."
          bash ../seedsigner-os/opt/luckfox/harden-nondev.sh "$ROOTFS_DIR"
          echo "📦 Applying non-dev size/boot optimizations ..."
          bash ../seedsigner-os/opt/luckfox/optimize-nondev.sh "$ROOTFS_DIR"
          # Boot-failover: fw_env.config lets fw_setenv/printenv reach the U-Boot env
          # (mtd0) so the U-Boot bootcount can be reset on success + configured (start-
          # seedsigner sets bootlimit/altbootcmd). Env layout verified from a device.
          echo "🧭 Installing /etc/fw_env.config (U-Boot env access for boot-failover) ..."
          cp -v ../seedsigner-os/opt/luckfox/files/fw_env.config "$ROOTFS_DIR/etc/fw_env.config"
        else
          echo "🛠️  dev build: skipping rootfs hardening/optimization (serial console + adb retained, SDK-default boot)"
        fi

    - name: Package firmware
      run: |
        cd luckfox-pico
        ./build.sh firmware

        echo "UART bootargs debug (post-firmware image metadata):"
        FOUND_UART_FILES=false
        for f in output/image/*.txt output/image/*.cfg output/image/*.ini output/image/parameter*; do
          if [ -e "$f" ]; then
            FOUND_UART_FILES=true
            echo "==> $f"
            grep -nE 'ttyFIQ0|console=|earlycon=|user_debug=|CMDLINE|BOOTARGS' "$f" || echo "  (no matching bootarg tokens)"
          fi
        done
        if [ "$FOUND_UART_FILES" != "true" ]; then
          echo "No text-like image metadata files found under output/image"
        fi

        if grep -aEq 'console=ttyFIQ0|earlycon=uart8250|user_debug=' output/image/boot.img; then
          echo "ERROR: UART console/debug tokens still present in output/image/boot.img"
          exit 1
        fi

    - name: Create flashable SD image
      if: matrix.boot == 'SD_CARD'
      run: |
        cd luckfox-pico/output/image
        
        HARDWARE="${{ matrix.hardware }}"
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        
        # Determine board label (mini, max, or pi)
        if [[ "$HARDWARE" == *"Mini"* ]]; then
          BOARD_LABEL="mini"
        elif [[ "$HARDWARE" == *"Max"* ]]; then
          BOARD_LABEL="max"
        elif [[ "$HARDWARE" == *"Pico_Pi"* ]]; then
          BOARD_LABEL="pi"
        else
          BOARD_LABEL="unknown"
        fi
        
        IMAGE_NAME="seedsigner-luckfox-pico-${BOARD_LABEL}-sd-${TIMESTAMP}.img"
        
        # Use blkenvflash to create the SD image
        ../../../seedsigner-os/opt/luckfox/blkenvflash "$IMAGE_NAME"
        
        # Create artifacts directory and copy image
        mkdir -p ../../../build-artifacts
        cp -v "$IMAGE_NAME" ../../../build-artifacts/

    - name: Create NAND flash bundle
      if: matrix.boot == 'SPI_NAND'
      run: |
        cd luckfox-pico/output/image
        
        HARDWARE="${{ matrix.hardware }}"
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        
        # Determine board label (mini, max, or pi)
        if [[ "$HARDWARE" == *"Mini"* ]]; then
          BOARD_LABEL="mini"
        elif [[ "$HARDWARE" == *"Max"* ]]; then
          BOARD_LABEL="max"
        elif [[ "$HARDWARE" == *"Pico_Pi"* ]]; then
          BOARD_LABEL="pi"
        else
          BOARD_LABEL="unknown"
        fi
        
        # Check that firmware packaging created the required files
        if [[ ! -f "update.img" ]]; then
          echo "ERROR: update.img not found. Firmware packaging may have failed."
          exit 1
        fi
        
        # Create NAND bundle directory
        NAND_BUNDLE_DIR="../../../build-artifacts/seedsigner-luckfox-pico-${BOARD_LABEL}-nand-files-${TIMESTAMP}"
        mkdir -p "$NAND_BUNDLE_DIR"
        
        # Required files for NAND flashing
        REQUIRED_FILES=(
          update.img
          download.bin
          env.img
          idblock.img
          uboot.img
          boot.img
          oem.img
          rootfs.img
          sd_update.txt
          tftp_update.txt
        )
        
        # Copy files to bundle directory
        MISSING_FILES=()
        for file in "${REQUIRED_FILES[@]}"; do
          if [[ -f "$file" ]]; then
            cp -v "$file" "$NAND_BUNDLE_DIR/"
          else
            MISSING_FILES+=("$file")
          fi
        done
        
        # Report missing files (some may be optional)
        if [[ ${#MISSING_FILES[@]} -ne 0 ]]; then
          echo "WARNING: Some files were not found: ${MISSING_FILES[*]}"
          # Only fail if critical files are missing
          if [[ ! -f "$NAND_BUNDLE_DIR/update.img" ]]; then
            echo "ERROR: Critical file update.img is missing"
            exit 1
          fi
        fi
        
        # Create README for NAND bundle
        cat > "$NAND_BUNDLE_DIR/README.txt" << 'EOF'
        SeedSigner Luckfox NAND Flash Bundle
        
        Contains SDK-generated NAND flashing files:
        - update.img / download.bin
        - partition images (*.img)
        - U-Boot scripts: sd_update.txt and tftp_update.txt
        
        Flash guidance for SPI-NAND:
        
        1. Download and extract the bundle
        2. Install LuckFox DriverAssitant and select "Driver Install"
        3. Connect the board while holding the BOOT button to enter MASKROM mode
        4. Use one of these methods:
           
           Method A - Windows upgrade_tool:
           - Use Windows upgrade_tool with update.img
           - Command: upgrade_tool uf update.img
           
           Method B - Linux/Mac rkdeveloptool:
           - Use rkdeveloptool with individual partition images
           - Follow the partition flash sequence in sd_update.txt
           
           Method C - U-Boot SD card update:
           - Copy all .img files and sd_update.txt to SD card root
           - Boot from SD card
           - U-Boot will automatically flash SPI-NAND from sd_update.txt
        
        For detailed flashing instructions, see:
        https://wiki.luckfox.com/Luckfox-Pico-Plus-Mini/Flash-image
        EOF
        
        # Bundle is ready - no tar.gz creation to avoid double-zipping
        # GitHub Actions will zip the folder when uploading artifact
        cd ../../../build-artifacts
        echo "✅ Created NAND bundle directory: $(basename "$NAND_BUNDLE_DIR")"
        ls -lh "$(basename "$NAND_BUNDLE_DIR")"

    - name: Create eMMC flash bundle
      if: matrix.boot == 'EMMC'
      run: |
        cd luckfox-pico/output/image
        
        HARDWARE="${{ matrix.hardware }}"
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        
        # Determine board label
        if [[ "$HARDWARE" == *"Pico_Pi"* ]]; then
          BOARD_LABEL="pi"
        else
          BOARD_LABEL="unknown"
        fi
        
        # Check that firmware packaging created the required files
        if [[ ! -f "update.img" ]]; then
          echo "ERROR: update.img not found. Firmware packaging may have failed."
          exit 1
        fi
        
        # Create eMMC bundle directory
        EMMC_BUNDLE_DIR="../../../build-artifacts/seedsigner-luckfox-pico-${BOARD_LABEL}-emmc-files-${TIMESTAMP}"
        mkdir -p "$EMMC_BUNDLE_DIR"
        
        # Files for eMMC flashing (copy what is available)
        EMMC_FILES=(
          update.img
          download.bin
          env.img
          idblock.img
          uboot.img
          boot.img
          oem.img
          rootfs.img
        )
        
        for file in "${EMMC_FILES[@]}"; do
          if [[ -f "$file" ]]; then
            cp -v "$file" "$EMMC_BUNDLE_DIR/"
          else
            echo "Optional file not found, skipping: $file"
          fi
        done
        
        # Create README for eMMC bundle
        cat > "$EMMC_BUNDLE_DIR/README.txt" << 'EOF'
        SeedSigner Luckfox eMMC Flash Bundle
        
        Contains SDK-generated eMMC flashing files:
        - update.img / download.bin
        - partition images (*.img)
        
        Flash guidance for eMMC:
        
        1. Download and extract the bundle
        2. Install LuckFox DriverAssistant and select "Driver Install"
        3. Connect the board while holding the BOOT button to enter MASKROM mode
        4. Use one of these methods:
           
           Method A - Windows SocToolKit (Easiest):
           - Open SocToolKit, select update.img and click Flash
           
           Method B - Linux/Mac rkdeveloptool:
           - Use rkdeveloptool with update.img
           - Command: rkdeveloptool uf update.img
        
        For detailed flashing instructions, see:
        https://wiki.luckfox.com/Luckfox-Pico-Plus-Mini/Flash-image
        EOF
        
        # Bundle is ready - no tar.gz creation to avoid double-zipping
        # GitHub Actions will zip the folder when uploading artifact
        cd ../../../build-artifacts
        echo "✅ Created eMMC bundle directory: $(basename "$EMMC_BUNDLE_DIR")"
        ls -lh "$(basename "$EMMC_BUNDLE_DIR")"

    - name: List build artifacts
      if: always()
      run: |
        echo "🎯 Build artifacts:"
        ls -lah build-artifacts/ 2>/dev/null || echo "No build artifacts directory found"
        
        if [ -d build-artifacts ]; then
          echo ""
          echo "📦 SD Card Images (.img):"
          find build-artifacts -name "*.img" -type f 2>/dev/null | while IFS= read -r f; do
            echo "  $(basename "$f") - $(du -sh "$f" | cut -f1)"
          done || echo "  No SD images found"
          
          echo ""
          echo "📦 NAND Bundles (.tar.gz):"
          find build-artifacts -name "*.tar.gz" -type f 2>/dev/null | while IFS= read -r f; do
            echo "  $(basename "$f") - $(du -sh "$f" | cut -f1)"
          done || echo "  No NAND bundles found"
        fi

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: seedsigner-luckfox-pico-${{ matrix.hardware }}-${{ matrix.boot }}-${{ github.run_number }}.zip
        path: build-artifacts/
        retention-days: 30
        if-no-files-found: warn
    
    - name: Upload artifacts to GitHub Release
      if: success() && github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="${{ inputs.release_tag }}"

        echo "🏷️ Uploading artifacts to release: $TAG"

        # Create the release if it doesn't already exist.
        # Multiple matrix jobs may race here; if creation fails because
        # another job already created it, the retry loop will pick it up.
        if ! gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
          echo "📦 Creating release $TAG..."
          CREATE_OUTPUT=$(gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Release $TAG" \
            --notes "Build artifacts for SeedSigner LuckFox Pico - $TAG" \
            --draft=false 2>&1) && echo "📦 Release created" || echo "⚠️ Release creation failed (may have been created by another job): $CREATE_OUTPUT"
        fi

        # Verify the release exists, retrying a few times to handle race conditions
        ATTEMPTS=0
        MAX_ATTEMPTS=5
        while ! gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; do
          ATTEMPTS=$((ATTEMPTS + 1))
          if [ "$ATTEMPTS" -ge "$MAX_ATTEMPTS" ]; then
            echo "❌ Failed to create or find release $TAG after $MAX_ATTEMPTS attempts"
            exit 1
          fi
          echo "⏳ Release not found yet, retrying ($ATTEMPTS/$MAX_ATTEMPTS)..."
          sleep "$((ATTEMPTS * 2))"
        done

        echo "✅ Release $TAG is ready"

        # Collect files to upload
        UPLOAD_FILES=()

        # SD card images are top-level .img files
        while IFS= read -r -d '' f; do
          UPLOAD_FILES+=("$f")
        done < <(find build-artifacts -maxdepth 1 -name "*.img" -type f -print0 2>/dev/null)

        # NAND and eMMC bundles are directories — zip them for release
        while IFS= read -r -d '' d; do
          DIRNAME=$(basename "$d")
          echo "📦 Zipping bundle directory: $DIRNAME"
          (cd build-artifacts && zip -r "${DIRNAME}.zip" "$DIRNAME")
          UPLOAD_FILES+=("build-artifacts/${DIRNAME}.zip")
        done < <(find build-artifacts -maxdepth 1 -mindepth 1 -type d -print0 2>/dev/null)

        if [ ${#UPLOAD_FILES[@]} -eq 0 ]; then
          echo "⚠️ No files found to upload to release"
          exit 0
        fi

        # Upload each file, skipping assets that already exist in the release
        EXISTING_ASSETS=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq ".assets[].name" 2>/dev/null || true)
        for f in "${UPLOAD_FILES[@]}"; do
          BASENAME=$(basename "$f")
          echo "⬆️  Uploading: $BASENAME"

          if echo "$EXISTING_ASSETS" | grep -qx "$BASENAME"; then
            echo "⏭️  Asset '$BASENAME' already exists in release $TAG, skipping"
          else
            gh release upload "$TAG" "$f" --repo "${{ github.repository }}" || {
              echo "❌ Failed to upload $BASENAME"
              exit 1
            }
            echo "✅ Uploaded: $BASENAME"
          fi
        done

    - name: Build summary
      if: always()
      run: |
        echo "## 🎯 SeedSigner Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Hardware**: ${{ matrix.hardware }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Boot Medium**: ${{ matrix.boot }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Run Number**: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        
        # Find SD card images
        SD_IMAGES=$(find build-artifacts -name "*.img" -type f 2>/dev/null || true)
        NAND_BUNDLES=$(find build-artifacts -name "*-nand-bundle-*.tar.gz" -type f 2>/dev/null || true)
        EMMC_BUNDLES=$(find build-artifacts -name "*-emmc-files-*" -type d 2>/dev/null || true)
        
        if [ -n "$SD_IMAGES" ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 💾 SD Card Images (Ready to Flash)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$SD_IMAGES" | while IFS= read -r f; do
            echo "$(basename "$f") - $(du -sh "$f" | cut -f1)"
          done >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**How to Flash SD Card:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the artifact from this build" >> $GITHUB_STEP_SUMMARY
          echo "2. Extract the .img file" >> $GITHUB_STEP_SUMMARY
          echo "3. Flash to SD card using one of these methods:" >> $GITHUB_STEP_SUMMARY
          echo "   - Raspberry Pi Imager (easiest)" >> $GITHUB_STEP_SUMMARY
          echo "   - \`dd\` command: \`sudo dd bs=4M status=progress if=<downloaded-image.img> of=/dev/sdX\`" >> $GITHUB_STEP_SUMMARY
          echo "     (Replace \`<downloaded-image.img>\` with actual filename and \`/dev/sdX\` with your SD card device)" >> $GITHUB_STEP_SUMMARY
          echo "4. Insert SD card into LuckFox Pico device and boot!" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ -n "$NAND_BUNDLES" ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 NAND Flash Bundles" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$NAND_BUNDLES" | while IFS= read -r f; do
            echo "$(basename "$f") - $(du -sh "$f" | cut -f1)"
          done >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**How to Flash SPI-NAND:**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Method 1: Windows - SocToolKit (Easiest)**" >> $GITHUB_STEP_SUMMARY
          echo "1. Download and install [SocToolKit](https://wiki.luckfox.com/Luckfox-Pico-Plus-Mini/Flash-image/#1-download-and-install-soctoolkit)" >> $GITHUB_STEP_SUMMARY
          echo "2. Extract the NAND bundle zip file" >> $GITHUB_STEP_SUMMARY
          echo "3. Connect device in MASKROM mode (hold BOOT button while connecting USB)" >> $GITHUB_STEP_SUMMARY
          echo "4. In SocToolKit: Select \`update.img\` and click Flash" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Method 2: Linux/Mac - rkdeveloptool**" >> $GITHUB_STEP_SUMMARY
          echo "1. Extract the NAND bundle zip file" >> $GITHUB_STEP_SUMMARY
          echo "2. Install rkdeveloptool: \`sudo apt install rkdeveloptool\` (Linux)" >> $GITHUB_STEP_SUMMARY
          echo "3. Connect device in MASKROM mode (hold BOOT button while connecting USB)" >> $GITHUB_STEP_SUMMARY
          echo "4. Flash individual partitions following \`sd_update.txt\` sequence" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Method 3: MicroSD Auto-Flash (No PC Connection)**" >> $GITHUB_STEP_SUMMARY
          echo "1. Extract NAND bundle and copy ALL files to MicroSD card root" >> $GITHUB_STEP_SUMMARY
          echo "2. Insert MicroSD into device and power on" >> $GITHUB_STEP_SUMMARY
          echo "3. U-Boot will automatically flash SPI-NAND from \`sd_update.txt\`" >> $GITHUB_STEP_SUMMARY
          echo "4. **Note:** This OVERWRITES existing SPI-NAND content" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Important:** NAND images are NOT the same as SD Card images!" >> $GITHUB_STEP_SUMMARY
          echo "- NAND bundles flash to onboard SPI-NAND storage" >> $GITHUB_STEP_SUMMARY
          echo "- SD Card images (\`.img\`) are for booting directly from SD" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📖 [Complete Flashing Guide](https://wiki.luckfox.com/Luckfox-Pico-Plus-Mini/Flash-image/)" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ -n "$EMMC_BUNDLES" ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 eMMC Flash Bundles (Pico Pi)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**How to Flash eMMC:**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Method 1: Windows - SocToolKit (Easiest)**" >> $GITHUB_STEP_SUMMARY
          echo "1. Download and install [SocToolKit](https://wiki.luckfox.com/Luckfox-Pico-Plus-Mini/Flash-image/#1-download-and-install-soctoolkit)" >> $GITHUB_STEP_SUMMARY
          echo "2. Extract the eMMC bundle zip file" >> $GITHUB_STEP_SUMMARY
          echo "3. Connect device in MASKROM mode (hold BOOT button while connecting USB)" >> $GITHUB_STEP_SUMMARY
          echo "4. In SocToolKit: Select \`update.img\` and click Flash" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Method 2: Linux/Mac - rkdeveloptool**" >> $GITHUB_STEP_SUMMARY
          echo "1. Extract the eMMC bundle zip file" >> $GITHUB_STEP_SUMMARY
          echo "2. Install rkdeveloptool: \`sudo apt install rkdeveloptool\` (Linux)" >> $GITHUB_STEP_SUMMARY
          echo "3. Connect device in MASKROM mode (hold BOOT button while connecting USB)" >> $GITHUB_STEP_SUMMARY
          echo "4. Run: \`rkdeveloptool uf update.img\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📖 [Complete Flashing Guide](https://wiki.luckfox.com/Luckfox-Pico-Plus-Mini/Flash-image/)" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ -z "$SD_IMAGES" ] && [ -z "$NAND_BUNDLES" ] && [ -z "$EMMC_BUNDLES" ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "❌ **No build artifacts found**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The build may have failed. Check the build logs above." >> $GITHUB_STEP_SUMMARY
        fi
