name: Build SeedSigner OS

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      app_repo:
        description: 'SeedSigner app repository URL'
        required: false
        default: 'https://github.com/3rdIteration/seedsigner'
      app_branch:
        description: 'SeedSigner app branch'
        required: false
        default: 'dev'
      seedsigner_release_tag:
        description: 'SeedSigner app release tag (overrides app branch if set)'
        required: false
        default: ''
      seedsigner_os_release_tag:
        description: 'SeedSigner OS release tag to upload artifacts to (e.g. v1.0.0)'
        required: false
        default: ''
      upload_to_release:
        description: 'Upload build artifacts to the seedsigner-os release'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build ${{ matrix.config }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - config: pi0-smartcard-dev
            board_flag: --pi0
          - config: pi02w-smartcard-dev
            board_flag: --pi02w
          - config: pi2-smartcard-dev
            board_flag: --pi2
          - config: pi4-smartcard-dev
            board_flag: --pi4
          - config: lafrite-smartcard-dev
            board_flag: --lafrite

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        run: |
          echo "Disk usage before cleanup:"
          df -h

          sudo rm -rf \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk \
            /usr/share/dotnet
          sudo apt-get clean
          docker system prune --all --force || true

          echo "Disk usage after cleanup:"
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.config }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.config }}-
            ccache-

      - name: Create required directories
        run: |
          mkdir -p images
          mkdir -p buildroot_dl
          mkdir -p .buildroot-ccache

      # What gets downloaded is a function of the buildroot pin (which fixes
      # every package version), the defconfigs, our external packages, and the
      # post-image scripts (they fetch the JDK/Ant tarballs into the same dir).
      # Rotating the key on all four keeps the cache from going permanently
      # stale: without the post-image scripts in here, bumping the JDK version
      # would leave the new tarball re-downloaded on every run forever, because
      # an exact key hit skips the save. (The defconfig glob also sweeps in
      # luckfox's, which this workflow does not build -- costs at worst one
      # extra cache miss, and is not worth a hand-maintained list.)
      - name: Compute buildroot cache key input
        id: dlkey
        run: echo "br=$(git rev-parse HEAD:opt/buildroot)" >> "$GITHUB_OUTPUT"

      # Deliberately not keyed on matrix.config: the five boards' download sets
      # overlap almost entirely, so one shared entry (~1-1.5GB) serves them all
      # and stays well inside the repo's 10GB cache budget. Every leg restores
      # it, the first to finish saves it, the rest no-op. A stale or partial
      # cache is harmless -- buildroot hash-checks each tarball and re-downloads
      # whatever is missing, so the worst case is the uncached behaviour.
      - name: Cache buildroot downloads
        id: dlcache
        uses: actions/cache@v4
        with:
          path: buildroot_dl
          key: buildroot-dl-${{ steps.dlkey.outputs.br }}-${{ hashFiles('opt/*/configs/*_defconfig', 'opt/external-packages/**', 'opt/*/board/post-image-seedsigner.sh') }}
          restore-keys: buildroot-dl-

      # Buildroot's real ccache (BR2_CCACHE=y points at /root/.buildroot-ccache,
      # which docker-compose mounts here). Distinct from the .ccache above, which
      # only serves the few host tools built before buildroot takes over -- hence
      # that one being 41MB while this is ~380MB per Pi board, 729MB for La Frite.
      # Worth caching because opt/build.sh wipes the output dir every run, so
      # every package is recompiled from scratch on a cold cache.
      #
      # Keyed per config (each board has its own toolchain) but on the same
      # stable inputs as the download cache rather than github.sha. A rolling
      # per-commit key would mint ~2GB of fresh entries every run and thrash the
      # 10GB budget; these inputs fully determine what gets compiled, so one
      # capture per input set is complete and later runs restore it unchanged.
      - name: Cache buildroot ccache
        uses: actions/cache@v4
        with:
          path: .buildroot-ccache
          key: buildroot-ccache-${{ matrix.config }}-${{ steps.dlkey.outputs.br }}-${{ hashFiles('opt/*/configs/*_defconfig', 'opt/external-packages/**') }}
          restore-keys: buildroot-ccache-${{ matrix.config }}-

      # Baseline for the cache report at the end of the job. Buildroot only ever
      # appends to the download dir, so (final - restored) is exactly what this
      # board pulled that the shared cache did not already have.
      - name: Measure restored download cache
        run: echo "DL_BYTES_BEFORE=$(sudo du -sb buildroot_dl | cut -f1)" >> "$GITHUB_ENV"

      - name: Capture OS provenance
        run: |
          echo "SEEDSIGNER_OS_REPO=https://github.com/${{ github.repository }}" >> "$GITHUB_ENV"
          echo "SEEDSIGNER_OS_BRANCH=${{ github.ref_name }}" >> "$GITHUB_ENV"
          echo "SEEDSIGNER_OS_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SEEDSIGNER_OS_DATE=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.config }}
        env:
          DOCKER_DEFAULT_PLATFORM: linux/amd64
          SS_ARGS: >-
            ${{ matrix.board_flag }}
            --smartcard
            --dev
            --app-repo=${{ inputs.app_repo || 'https://github.com/3rdIteration/seedsigner' }}
            --app-branch=${{ inputs.seedsigner_release_tag || inputs.app_branch || 'dev' }}
        run: docker compose up --force-recreate --build --exit-code-from build-images

      # actions/cache tars these as the unprivileged runner user, but the
      # container fills them as root -- and cargo's unpacked crate sources under
      # br-cargo-home land unreadable, so tar hit hundreds of "Cannot open:
      # Permission denied", exited 2, and the save was abandoned (run
      # 32685520661: every leg built fine, no cache was written). Hand the trees
      # back before the post-save steps run. Cheap: metadata only.
      - name: Make caches readable by the runner
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" buildroot_dl .buildroot-ccache

      # Keeps the 10GB per-repo budget answerable from measurements rather than
      # guesses: how much each board contributes to the shared download cache,
      # and how big its ccache has grown. Runs on failure too -- a build that
      # died partway still says something useful about size.
      # tee'd rather than just redirected because step summaries are not exposed
      # over the REST API, so the log is the only way to read these numbers back
      # without opening the run in a browser.
      - name: Report cache sizes
        if: always()
        run: |
          # sudo because the container creates these dirs as root; "|| true" so a
          # missing dir (build died early) reports 0 instead of failing the step.
          size() { local b=0; b=$(sudo du -sb "$1" 2>/dev/null | cut -f1) || true; echo "${b:-0}"; }
          human() { numfmt --to=iec --suffix=B "${1:-0}"; }

          dl_before=${DL_BYTES_BEFORE:-0}
          dl_after=$(size buildroot_dl)
          dl_delta=$(( dl_after - dl_before ))
          br_ccache=$(size .buildroot-ccache)
          host_ccache=$(size .ccache)

          {
            echo "## Cache report — \`${{ matrix.config }}\`"
            echo
            echo "Download cache: **${{ steps.dlcache.outputs.cache-hit == 'true' && 'exact hit' || 'miss or partial restore' }}**"
            echo
            echo "| Directory | Size | Cached today? |"
            echo "| --- | --: | --- |"
            echo "| \`buildroot_dl\` restored at job start | $(human $dl_before) | yes, shared by all boards |"
            echo "| \`buildroot_dl\` added by this board | $(human $dl_delta) | this board's unique contribution |"
            echo "| \`buildroot_dl\` final | $(human $dl_after) | yes, this is what gets saved |"
            echo "| \`.buildroot-ccache\` | $(human $br_ccache) | yes, per board |"
            echo "| \`.ccache\` | $(human $host_ccache) | yes, host tools only |"
            echo
            echo "Sizes are on disk; cache entries are compressed and land smaller."
            echo "The repo-wide budget is 10GB shared across every branch, and no"
            echo "single job can see its siblings -- sum these across the five jobs"
            echo "for the fleet total, or read it straight off \`gh cache list\`."
            echo
            echo "<details><summary>Largest downloads</summary>"
            echo
            echo '```'
            sudo du -sh buildroot_dl/* 2>/dev/null | sort -rh | head -20 || true
            echo '```'
            echo
            echo "</details>"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: seedsigner-os-${{ matrix.config }}
          path: images/seedsigner_os.*.img
          retention-days: 7
          if-no-files-found: warn

      - name: Upload to GitHub Release
        if: success() && inputs.upload_to_release && inputs.seedsigner_os_release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for img in images/seedsigner_os.*.img; do
            if [ -f "$img" ]; then
              new_name="seedsigner_os-${{ matrix.config }}.img"
              gh release upload "${{ inputs.seedsigner_os_release_tag }}" "${img}#${new_name}" --clobber
            fi
          done
