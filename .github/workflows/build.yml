name: Build SeedSigner OS

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      app_repo:
        description: 'SeedSigner app repository URL'
        required: false
        default: 'https://github.com/3rdIteration/seedsigner'
      app_branch:
        description: 'SeedSigner app branch'
        required: false
        default: 'dev'
      seedsigner_release_tag:
        description: 'SeedSigner app release tag (overrides app branch if set)'
        required: false
        default: ''
      seedsigner_os_release_tag:
        description: 'SeedSigner OS release tag to upload artifacts to (e.g. v1.0.0)'
        required: false
        default: ''
      upload_to_release:
        description: 'Upload build artifacts to the seedsigner-os release'
        required: false
        type: boolean
        default: false
      board:
        description: 'Board to build (all = every board, as push/PR builds do)'
        required: false
        type: choice
        default: 'all'
        options:
          - all
          - pi0
          - pi02w
          - pi2
          - pi4
          - lafrite
      variant:
        description: 'dev (serial console + dev marker) or non-dev (hardened release image)'
        required: false
        type: choice
        default: 'dev'
        options:
          - dev
          - non-dev

jobs:
  # A one-board rebuild is the common case when chasing a board-specific bug, and
  # the release images are the non-dev ones -- so the matrix is built from the
  # dispatch inputs rather than hardcoded. push/PR events pass no inputs and get
  # the previous behaviour: every board, dev variant.
  select-targets:
    name: Select build targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Build the matrix
        id: select
        env:
          BOARD: ${{ inputs.board || 'all' }}
          VARIANT: ${{ inputs.variant || 'dev' }}
        run: |
          suffix=""
          if [ "$VARIANT" = "dev" ]; then
            suffix="-dev"
          fi
          matrix=$(jq -cn --arg board "$BOARD" --arg suffix "$suffix" '
            ["pi0", "pi02w", "pi2", "pi4", "lafrite"]
            | map(select($board == "all" or . == $board))
            | {include: map({config: (. + "-smartcard" + $suffix), board_flag: ("--" + .)})}')
          echo "Selected targets: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.config }}
    needs: select-targets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.select-targets.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        run: |
          echo "Disk usage before cleanup:"
          df -h

          sudo rm -rf \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk \
            /usr/share/dotnet
          sudo apt-get clean
          docker system prune --all --force || true

          echo "Disk usage after cleanup:"
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.config }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.config }}-
            ccache-

      - name: Create required directories
        run: |
          mkdir -p images
          mkdir -p buildroot_dl

      - name: Capture OS provenance
        run: |
          echo "SEEDSIGNER_OS_REPO=https://github.com/${{ github.repository }}" >> "$GITHUB_ENV"
          echo "SEEDSIGNER_OS_BRANCH=${{ github.ref_name }}" >> "$GITHUB_ENV"
          echo "SEEDSIGNER_OS_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SEEDSIGNER_OS_DATE=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.config }}
        env:
          DOCKER_DEFAULT_PLATFORM: linux/amd64
          SS_ARGS: >-
            ${{ matrix.board_flag }}
            --smartcard
            ${{ (inputs.variant || 'dev') == 'dev' && '--dev' || '' }}
            --app-repo=${{ inputs.app_repo || 'https://github.com/3rdIteration/seedsigner' }}
            --app-branch=${{ inputs.seedsigner_release_tag || inputs.app_branch || 'dev' }}
        run: docker compose up --force-recreate --build --exit-code-from build-images

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: seedsigner-os-${{ matrix.config }}
          path: images/seedsigner_os.*.img
          retention-days: 7
          if-no-files-found: warn

      - name: Upload to GitHub Release
        if: success() && inputs.upload_to_release && inputs.seedsigner_os_release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for img in images/seedsigner_os.*.img; do
            if [ -f "$img" ]; then
              new_name="seedsigner_os-${{ matrix.config }}.img"
              gh release upload "${{ inputs.seedsigner_os_release_tag }}" "${img}#${new_name}" --clobber
            fi
          done
