services:
  build-images:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./opt:/opt
      - ./images:/images
      - ./.ccache:/root/.cache/ccache
      - ./.buildroot-ccache:/root/.buildroot-ccache
    environment:
      # Forwarded from the host (set by CI) so the build can stamp seedsigner-os
      # provenance into /etc/seedsigner-os-release. Unset locally -> "unknown".
      - SEEDSIGNER_OS_REPO
      - SEEDSIGNER_OS_BRANCH
      - SEEDSIGNER_OS_COMMIT
      - SEEDSIGNER_OS_DATE
      # Off unless explicitly set to "1" -- see post-build.sh in each
      # *-smartcard* profile and opt/luckfox/{os-build,build-local}.sh.
      - SEEDSIGNER_ENABLE_ERROR_DIAGNOSTICS
      # Off unless explicitly set to "1" -- see post-build.sh in each
      # *-smartcard* profile and opt/luckfox/{os-build,build-local}.sh. Ships
      # the marker that swaps Home's menu for the hardware test menu (see
      # seedsigner repo: helpers/seedsigner_os.py is_testing_build_enabled()).
      - SEEDSIGNER_TESTING_BUILD
      # Tuning for opt/build.sh's retries around transient network failures
      # (flaky upstream mirrors). Unset -> the defaults in opt/build.sh.
      # Set NETWORK_MAX_ATTEMPTS=1 to fail fast instead of retrying.
      - NETWORK_MAX_ATTEMPTS
      - NETWORK_RETRY_DELAY
      - BR2_WGET_CMD
    command: "${SS_ARGS:---no-op}"
