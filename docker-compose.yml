services:
  build-images:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./opt:/opt
      - ./images:/images
      - ./.ccache:/root/.cache/ccache
      - ./.buildroot-ccache:/root/.buildroot-ccache
    environment:
      # Forwarded from the host (set by CI) so the build can stamp seedsigner-os
      # provenance into /etc/seedsigner-os-release. Unset locally -> "unknown".
      - SEEDSIGNER_OS_REPO
      - SEEDSIGNER_OS_BRANCH
      - SEEDSIGNER_OS_COMMIT
      - SEEDSIGNER_OS_DATE
      # Off unless explicitly set to "1" -- see post-build.sh in each
      # *-smartcard* profile and opt/luckfox/{os-build,build-local}.sh.
      - SEEDSIGNER_ENABLE_ERROR_DIAGNOSTICS
    command: "${SS_ARGS:---no-op}"
