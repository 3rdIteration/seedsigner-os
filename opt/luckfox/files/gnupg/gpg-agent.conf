# Seeded into GNUPGHOME (/tmp/.gnupg) at boot by /start-seedsigner.sh.
#
# Duplicated from opt/rootfs-overlay/root/.gnupg/gpg-agent.conf, which the
# Pi/La Frite images install via BR2_ROOTFS_OVERLAY. The Luckfox defconfigs set
# BR2_ROOTFS_OVERLAY="" and opt/luckfox/Dockerfile only copies configs/, files/,
# scripts/ and *.sh, so opt/rootfs-overlay/ is not reachable from the Luckfox
# Docker build context. Keep the two in step.
pinentry-program /usr/bin/pinentry
