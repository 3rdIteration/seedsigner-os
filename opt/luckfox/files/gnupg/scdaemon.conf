# Seeded into GNUPGHOME (/tmp/.gnupg) at boot by /start-seedsigner.sh.
#
# disable-ccid stops scdaemon using its own built-in CCID driver and makes it go
# through pcscd instead. That matters here: S60pcscd runs pcscd for the SEC1210
# reader, and a scdaemon holding the USB device directly would contend with it.
# Until GNUPGHOME was writable, gpg-agent/scdaemon could not create their sockets
# and so never ran at all -- giving them a working home means they start, which
# is why this file has to land with them.
#
# If sharing violations still appear, the next lever is `pcsc-shared` (scdaemon
# connects SCARD_SHARE_EXCLUSIVE by default). Rollback is deleting this file.
#
# Duplicated from opt/rootfs-overlay/root/.gnupg/scdaemon.conf -- see the note in
# gpg-agent.conf for why the Luckfox copy cannot simply reuse that one.
disable-ccid
