# /etc/mdev.conf - mdev hotplug configuration for SeedSigner LuckFox Pico
#
# Format: <regex>  <user>:<group>  <octal-perm>  [action]<command>
#   @ = run command after creating the device node
#   $ = run command before removing the device node
#
# Run FAT filesystem check on newly-added MicroSD / USB block partitions.
# The fat-fsck-hotplug helper repairs FAT errors before the partition is
# mounted, preventing read-only remounts caused by filesystem corruption.
#
mmcblk[0-9]p[0-9]*   root:disk 0660 @/usr/sbin/fat-fsck-hotplug
sd[a-z][0-9]*         root:disk 0660 @/usr/sbin/fat-fsck-hotplug
