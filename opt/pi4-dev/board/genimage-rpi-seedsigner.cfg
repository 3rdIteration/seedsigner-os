image boot.vfat {
  vfat {
    files = {
      "bcm2711-rpi-4-b.dtb",
      "rpi-firmware/bootcode.bin",
      "rpi-firmware/cmdline.txt",
      "rpi-firmware/config.txt",
      "rpi-firmware/fixup4x.dat",
      "rpi-firmware/start4x.elf",
      "rpi-firmware/overlays",
      "zImage"
    }
    label = "SEEDSIGNDEV"
  }
  # SeedSigner fork (3rdIteration): the fork's dev images carry more in the
  # initramfs than upstream's, so the boot partition keeps the fork's 1G.
  size = 1G
}

# Persistent scratch space for on-device development (git clones, venvs,
# dropbear host keys, ...). Mounted at /mnt/data by S30devdata.
image data.ext4 {
  ext4 {
    label = "seedsigner-data"
    use-mke2fs = true
  }
  size = 256M
}

image seedsigner_os.img {
  hdimage {
  }

  partition boot {
    partition-type = 0xC
    bootable = "true"
    image = "boot.vfat"
  }

  partition data {
    partition-type = 0x83
    image = "data.ext4"
  }
}
