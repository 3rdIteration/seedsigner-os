# Hybrid BIOS+EFI bootable USB image.
#
# Layout (MBR, first partition at the 1 MiB default offset):
#   * MBR boot code + grub core.img in the MBR gap (512 .. 1 MiB) -> legacy BIOS
#   * partition 1: FAT32 ESP (type 0xEF) carrying /bzImage, the EFI binaries
#     under /EFI/BOOT (bootx64.efi + bootia32.efi, grub.cfg next to them) and
#     /boot/grub/grub.cfg for the BIOS core (whose embedded prefix is
#     (hd0,msdos1)/boot/grub -- see BR2_TARGET_GRUB2_BOOT_PARTITION default)
#   * partition 2: ext4 rootfs. The kernel finds it via
#     root=PARTUUID=ba5eba11-02: for dos tables the kernel derives each
#     partition's PARTUUID as "<disk signature>-%02x" from the MBR disk
#     signature at 0x1b8 (block/partitions/msdos.c set_info), so the
#     signature is pinned to ba5eba11 here and re-checked (and re-pinned)
#     by post-image-seedsigner.sh.
#
# grub-bios.cfg and grub-efi.cfg have identical content; they are installed
# separately only because the two firmwares look for grub.cfg in different
# places. All commands they use (linux/boot) are built into both grub images,
# so no module files need to be staged on the FAT.
image seedsigner-boot.vfat {
  vfat {
    files = {
      "bzImage"
    }

    file EFI/BOOT/bootx64.efi {
      image = "efi-part/EFI/BOOT/bootx64.efi"
    }

    file EFI/BOOT/bootia32.efi {
      image = "efi-part/EFI/BOOT/bootia32.efi"
    }

    file EFI/BOOT/grub.cfg {
      image = "grub-efi.cfg"
    }

    file boot/grub/grub.cfg {
      image = "grub-bios.cfg"
    }

    label = "SEEDSIGNOS"
  }
  size = 32M
}

image seedsigner_os.img {
  hdimage {
    # genimage defaults the MBR disk signature to 0, which would make the
    # kernel compute PARTUUID "00000000-02" for the rootfs and never match
    # grub's root=PARTUUID=ba5eba11-02. Pin it. Quoted because genimage
    # reads the option with cfg_getstr()+strtoul(), not as a cfg integer.
    disk-signature = "0xba5eba11"
  }

  partition mbrboot {
    in-partition-table = false
    image = "boot.img"
    offset = 0
    size = 512
    holes = {"(440; 512)"}
  }

  partition grubcore {
    in-partition-table = false
    image = "grub.img"
    offset = 512
  }

  partition boot {
    partition-type = 0xEF
    bootable = "true"
    image = "seedsigner-boot.vfat"
  }

  partition rootfs {
    partition-type = 0x83
    image = "rootfs.ext2"
  }
}
