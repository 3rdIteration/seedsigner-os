set default="0"
set timeout="3"

# The rootfs is an initrd unpacked into RAM, so there is no root= and the
# USB stick can be removed once the app is up.
#
# video=: the app's desktop window is a fixed 960x480 (an emulated 240x240
# LCD plus the button panels, scaled 2x). Running the built-in panel at
# exactly that mode makes the window fill the screen; i915 and most laptop
# GPUs scale it up to the panel's native resolution. Only the internal-panel
# connectors are named so an external HDMI monitor keeps its own preferred
# mode. To change it, edit this file on the SEEDSIGNOS partition from any PC
# (delete both video= arguments to go back to native resolution).
menuentry "SeedSigner OS (x86_64 desktop)" {
	linux /bzImage console=tty1 video=eDP-1:960x480 video=LVDS-1:960x480
	initrd /rootfs.cpio.gz
}
