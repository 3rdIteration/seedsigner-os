set default="0"
set timeout="3"

# The rootfs is an initrd unpacked into RAM, so there is no root= and the
# USB stick can be removed once the app is up. The display stays at the
# panel's native mode for compatibility; scaling the desktop UI to fill it
# is the app's job (SEEDSIGNER_DESKTOP_FULLSCREEN, set by xinitrc-seedsigner).
menuentry "SeedSigner OS (x86_64 desktop)" {
	linux /bzImage console=tty1
	initrd /rootfs.cpio.gz
}
